<script>
const frame=document.getElementById('app');
const grillData=`gemuese:{title:'Grillgemüse',items:[['zucchini','Zucchini','frisch','g',400],['paprika-rot','Rote Paprika','frisch','count',2,'Stück',1],['paprika-gelb','Gelbe Paprika','frisch','count',1,'Stück',1],['champignons','Champignons','frisch','g',400],['zwiebel-rot','Rote Zwiebeln','frisch','count',4,'Stück',1],['brauner-zucker','Brauner Zucker','vorrat','ml',5],['suesskartoffeln','Süßkartoffeln','frisch','g',200],['erdnuesse-ungesalzen','Erdnüsse, ungesalzen','vorrat','g',20],['kichererbsen-dose','Kichererbsen aus der Dose','vorrat','g',200],['cherrytomaten','Cherrytomaten','frisch','count',8,'Stück',1],['rapsoel','Rapsöl','vorrat','ml',45],['salz','Salz','vorrat','note',0,'zusätzlich nach Bedarf'],['pfeffer','Schwarzer Pfeffer','vorrat','note',0,'nach Geschmack'],['spargel','Spargel','frisch','g',400,'',0,1],['parmesan','Parmesan','milch','ml',15,'',0,1],['feta','Feta','milch','g',200,'',0,1],['hokkaido-kuerbis','Hokkaido-Kürbis','frisch','g',400,'',0,1],['kartoffelecken','Kartoffelecken','frisch','g',400,'',0,1]]}`;
const chickenData=`chicken:{title:'Chicken Asado',base:2,items:[['maishaehnchen','Maishähnchen','fleisch','count',1,'Stück',1],['orange','Orange','frisch','count',1,'Stück',1],['limette','Limette','frisch','count',1,'Stück',1],['knoblauch','Knoblauch','frisch','count',4,'Zehen',1],['kreuzkuemmel','Kreuzkümmel','vorrat','ml',5],['oregano','Oregano','vorrat','ml',5],['salz','Salz','vorrat','ml',5],['paprika-geraeuchert','Geräuchertes Paprikapulver','vorrat','ml',22.5],['essig','Essig','vorrat','ml',15],['olivenoel','Olivenöl','vorrat','ml',37.5],['pfeffer','Schwarzer Pfeffer','vorrat','note',0,'nach Geschmack']]}`;
const beerChickenData=`beerchicken:{title:'Beer Can Chicken',base:2,items:[['bier-05-dose','Bier, 0,5-l-Dose','vorrat','count',1,'Dose',1],['maishaehnchen','(Mais-)Hähnchen','fleisch','count',1,'Stück',1],['zwiebeln','Zwiebeln','frisch','count',2,'Stück',1],['zwiebel-rot','Rote Zwiebeln','frisch','count',2,'Stück',1],['haehnchengewuerz','Hähnchengewürz','vorrat','note',0,'1 Prise'],['olivenoel','Olivenöl','vorrat','ml',45],['salz','Salz','vorrat','note',0,'1 Prise'],['butter','Butter','milch','ml',15]]}`;
const ibericoData=`iberico:{title:'Ibérico Bellota Carré',base:4,items:[['iberico-bellota-carre','Ibérico Bellota Carré am Stück','fleisch','g',1500],['salz','Salz','vorrat','note',0,'nach Geschmack'],['pfeffer','Schwarzer Pfeffer','vorrat','note',0,'nach Geschmack'],['rosmarin-frisch','Rosmarin, frisch','frisch','count',1,'kleiner Zweig',0,1]]}`;
const salsaData=`salsaverde:{title:'Salsa Verde',base:4,items:[['petersilie-bund','Glatte Petersilie','frisch','count',1,'Bund',0],['olivenoel','Olivenöl','vorrat','ml',60],['zitronensaft','Zitronensaft','frisch','range',5,10],['knoblauch','Knoblauch','frisch','count',0.5,'Zehe',0],['salz','Salz','vorrat','note',0,'nach Geschmack']]}`;
const lammlachsData=`lammlachse:{title:'Lammlachse mit Rosmarin',base:2,items:[['lammlachse','Lammlachse','fleisch','count',2,'Stück',1],['olivenoel','Olivenöl','vorrat','ml',30],['rosmarin-frisch','Rosmarin, frisch','frisch','count',2,'Zweige',1],['thymian-frisch','Thymian, frisch','frisch','count',3,'Zweige',1],['knoblauch','Knoblauch','frisch','count',2,'Zehen',1],['butter','Butter','milch','ml',15],['salz','Meersalz','vorrat','note',0,'nach Geschmack'],['pfeffer','Schwarzer Pfeffer','vorrat','note',0,'nach Geschmack']]}`;
const lambData=`lamm:{title:'Toskanisches Lammkarree',base:4,items:[['lammkarree','Lammkarree','fleisch','count',4,'Stück',1],['weisswein-trocken','Trockener Weißwein','vorrat','ml',200],['wermut','Wermut','vorrat','ml',60],['honig','Honig','vorrat','ml',30],['kartoffeln-festkochend','Kartoffeln, festkochend','frisch','count',12,'Stück',1],['fruehlingszwiebeln','Frühlingszwiebeln','frisch','count',8,'Stück',1],['rapsoel','Rapsöl','vorrat','ml',30],['rosmarin-getrocknet','Rosmarin, getrocknet','vorrat','ml',120],['thymian-getrocknet','Thymian, getrocknet','vorrat','ml',120],['salbei-getrocknet','Salbei, getrocknet','vorrat','ml',30],['knoblauch-granuliert','Knoblauch, granuliert','vorrat','ml',60],['zwiebel-granuliert','Zwiebel, granuliert','vorrat','ml',60],['chilipulver','Chilipulver','vorrat','ml',30],['salz','Salz','vorrat','ml',60]]}`;

async function init(){
  try{
    let html=await fetch('einkaufsliste-gesamt-basis.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Basisdatei nicht erreichbar');return r.text()});
    const grillPattern=/gemuese:\{[\s\S]*?\},\nfresh:/;
    if(!grillPattern.test(html))throw new Error('Grillgemüse-Daten nicht gefunden');
    html=html.replace(grillPattern,grillData+',\n'+chickenData+',\n'+beerChickenData+',\n'+lambData+',\n'+ibericoData+',\n'+salsaData+',\n'+lammlachsData+',\nfresh:');
    html=html.replace('<span>Gemüse, Rapsöl sowie Salz und Pfeffer.</span>','<span>Zucchini, Paprika, Süßkartoffeln, Kichererbsen, Erdnüsse, Tomaten und optionale Extras.</span>');
    if(!html.includes('value="chicken"')){
      const choice=`<article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="chicken"><span class="choice-copy"><b>Chicken Asado</b><span>Maishähnchen mit Orange-Limetten-Marinade.</span></span></label></article>\n`;
      html=html.replace('<article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="entrecote">',choice+'<article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="entrecote">');
    }
    if(!html.includes('value="beerchicken"')){
      const beerChoice=`<article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="beerchicken"><span class="choice-copy"><b>Beer Can Chicken</b><span>Aufrecht gegartes Hähnchen mit Bier, Zwiebeln und Gewürzöl.</span></span></label></article>\n`;
      html=html.replace('<article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="entrecote">',beerChoice+'<article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="entrecote">');
    }
    if(!html.includes('value="lamm"')){
      const lambChoice=`<article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="lamm"><span class="choice-copy"><b>Toskanisches Lammkarree</b><span>Lammkarree mit Kräuter-Rub, Weißwein-Wermut-Honig-Mop, Kartoffeln und Frühlingszwiebeln.</span></span></label></article>\n`;
      html=html.replace('<article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="entrecote">',lambChoice+'<article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="entrecote">');
    }
    if(!html.includes('value="iberico"'))html=html.replace('<article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="entrecote">',"<article class=\"recipe-choice\"><label class=\"choice-main\"><input class=\"recipe-checkbox\" type=\"checkbox\" value=\"iberico\"><span class=\"choice-copy\"><b>Ibérico Bellota Carré</b><span>Karree, Salz, Pfeffer und optional Rosmarin.</span></span></label></article><article class=\"recipe-choice\"><label class=\"choice-main\"><input class=\"recipe-checkbox\" type=\"checkbox\" value=\"salsaverde\"><span class=\"choice-copy\"><b>Salsa Verde</b><span>Petersilie, Olivenöl, Zitrone und Knoblauch.</span></span></label></article>"+'<article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="entrecote">');
    if(!html.includes('value="lammlachse"'))html=html.replace('<article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="entrecote">','<article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="lammlachse"><span class="choice-copy"><b>Lammlachse mit Rosmarin</b><span>Klassisch mit Thymian, Knoblauch und Butter.</span></span></label></article><article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="entrecote">');
    html=html.replace(/<meta name="book-version" content="[^"]+">/,'<meta name="book-version" content="2.19.1">');
    html=html.replace('</head>','<base href="./" target="_top" data-kim-wrapper="true"></head>');
    frame.addEventListener('load',installShare,{once:true});
    frame.srcdoc=html;
  }catch(error){
    frame.classList.add('ready');
    document.body.insertAdjacentHTML('beforeend','<p class="error">Die gemeinsame Einkaufsliste konnte nicht geladen werden.</p>');
    console.error(error);
  }
}

function setupPdfSharing(button, getData, printButton, win){
  button.disabled=true;
  button.textContent='PDF wird vorbereitet …';
  const script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  script.onload=()=>{button.disabled=false;button.textContent='PDF senden'};
  script.onerror=()=>{button.disabled=false;button.textContent='Drucken / PDF';button.title='PDF-Bibliothek nicht erreichbar; Druckdialog verwenden'};
  document.head.appendChild(script);
  const printable=printButton.cloneNode(true);
  printable.id='print-list-copy';printable.textContent='Drucken';
  button.after(printable);
  printable.addEventListener('click',()=>win.print());
  button.addEventListener('click',async()=>{
    const data=getData();
    if(!data.rows.length){win.alert('Bitte zuerst eine Einkaufsliste erstellen.');return}
    if(!window.jspdf){win.print();return}
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    const width=210,margin=18,right=width-margin;
    let y=24;
    pdf.setFont('helvetica','bold');pdf.setFontSize(20);pdf.text('Einkaufsliste',margin,y);
    y+=12;pdf.setFontSize(12);pdf.text(pdf.splitTextToSize(data.title,174),margin,y);y+=12;
    pdf.setFont('helvetica','normal');pdf.setFontSize(10);
    for(const info of data.meta){
      if(!info)continue;
      const parts=pdf.splitTextToSize(info,174);
      for(const part of parts){pdf.text(part,margin,y);y+=5}
    }
    y+=5;pdf.setDrawColor(205);pdf.line(margin,y,right,y);y+=9;
    pdf.setFontSize(11);
    let previousCategory='';
    for(const row of data.rows){
      if(row.category&&row.category!==previousCategory){if(y+12>277){pdf.addPage();y=24}y+=3;pdf.setFont('helvetica','bold');pdf.setFontSize(12);pdf.text(row.category,margin,y);y+=9;pdf.setFont('helvetica','normal');pdf.setFontSize(11);previousCategory=row.category}
      const label=(row.checked?'[x] ':'[ ] ')+row.name+(row.amount?'  -  '+row.amount:'');
      const parts=pdf.splitTextToSize(label,174);
      if(y+Math.max(7,parts.length*5)>277){pdf.addPage();y=24}
      for(const part of parts){pdf.text(part,margin,y);y+=5.5}
      y+=3;
    }
    pdf.setFontSize(9);pdf.setTextColor(115);
    pdf.text('Haralds Grillkochbuch',margin,285);
    const filename='Einkaufsliste-'+(data.title.toLowerCase().replace(/[^a-z0-9äöüß]+/g,'-').replace(/^-|-$/g,'')||'grillkochbuch')+'.pdf';
    const blob=pdf.output('blob');
    const file=new File([blob],filename,{type:'application/pdf'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'Einkaufsliste als PDF'});return}
      catch(error){if(error?.name==='AbortError')return}
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    win.alert('Die Einkaufsliste wurde als PDF gespeichert. Du kannst diese Datei nun als Anhang versenden.');
  });
}


async function createSnapshotUrl(data){
  const payload={v:1,t:String(data.title||'Einkaufsliste'),m:(data.meta||[]).map(String),r:data.rows.map(r=>[String(r.name||''),String(r.amount||''),!!r.checked,String(r.category||'Öle, Gewürze & Vorrat')])};
  let bytes=new TextEncoder().encode(JSON.stringify(payload)),mode='b';
  if('CompressionStream' in window){
    try{
      const zipped=await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
      if(zipped.byteLength<bytes.byteLength){bytes=new Uint8Array(zipped);mode='z'}
    }catch(error){console.warn('Komprimierung nicht verfügbar',error)}
  }
  let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
  return new URL('einkaufsliste-ansicht.html',location.href).href+'#'+mode+btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function setupLinkSharing(pdfButton,getData,win){
 const button=pdfButton.cloneNode(true);
 button.id='link-send-button';button.disabled=false;button.textContent='Link senden';button.setAttribute('aria-label','Fertige Einkaufsliste als Link senden');
 const print=document.getElementById('print-list-copy'); 
 pdfButton.after(button);
 button.addEventListener('click',async()=>{
   const data=getData();
   if(!data.rows.length){win.alert('Bitte zuerst eine Einkaufsliste erstellen.');return}
   try{
     const url=await createSnapshotUrl(data);
     // Der Link ist vollständig selbstenthaltend; keine Server-Speicherung.
     if(navigator.share){
       try{await navigator.share({title:'Einkaufsliste – '+data.title,url});return}
       catch(error){if(error?.name==='AbortError')return}
     }
     if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(url);win.alert('Link zur fertigen Einkaufsliste kopiert. Jetzt kannst du ihn verschicken.');return}
     win.prompt('Diesen Link zur fertigen Einkaufsliste kopieren:',url);
   }catch(error){win.alert('Der Link konnte nicht erstellt werden: '+error.message)}
 });
}

function installShare(){
 const doc=frame.contentDocument,win=frame.contentWindow;
 if(!doc||!win){frame.classList.add('ready');return}
 document.title=doc.title;
 const printButton=doc.getElementById('print-list');
 if(!printButton){frame.classList.add('ready');return}
 const button=printButton.cloneNode(true);
 button.id='pdf-send-button';button.setAttribute('aria-label','Einkaufsliste als PDF senden');
 printButton.replaceWith(button);
 setupPdfSharing(button,()=>{const rows=[...doc.querySelectorAll('.shopping-item')].map(row=>({checked:!!row.querySelector('input[type="checkbox"]')?.checked,name:row.querySelector('.item-name')?.textContent.trim()||'',category:row.closest('.shopping-group')?.querySelector('h3')?.textContent.trim()||'Öle, Gewürze & Vorrat',amount:row.querySelector('.item-amount')?.textContent.trim()||''}));
    return {title:'Gemeinsame Einkaufsliste',meta:[doc.getElementById('result-meta')?.textContent.trim()||'',doc.getElementById('selection-summary')?.textContent.trim()||''],rows};},printButton,win);
 setupLinkSharing(button,()=>{const rows=[...doc.querySelectorAll('.shopping-item')].map(row=>({checked:!!row.querySelector('input[type="checkbox"]')?.checked,name:row.querySelector('.item-name')?.textContent.trim()||'',category:row.closest('.shopping-group')?.querySelector('h3')?.textContent.trim()||'Öle, Gewürze & Vorrat',amount:row.querySelector('.item-amount')?.textContent.trim()||''}));return {title:'Gemeinsame Einkaufsliste',meta:[doc.getElementById('result-meta')?.textContent.trim()||'',doc.getElementById('selection-summary')?.textContent.trim()||''],rows};},win);
 frame.classList.add('ready');
}

init();
</script>
