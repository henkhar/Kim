<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemeinsame Einkaufsliste · Haralds Grillkochbuch</title>
<style>html,body{width:100%;height:100%;margin:0;background:#f5f5f7;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}noscript{display:block;padding:24px;font-family:Arial,sans-serif}</style>
</head>
<body>
<noscript>Für die Einkaufsliste muss JavaScript aktiviert sein.</noscript>
<iframe id="app" title="Gemeinsame Einkaufsliste" allow="web-share"></iframe>
<script>
const frame=document.getElementById('app');
frame.src='einkaufsliste-gesamt-basis.html'+location.search;
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  const win=frame.contentWindow;
  if(!doc||!win)return;
  document.title=doc.title;
  if(doc.head&&!doc.querySelector('base[data-kim-wrapper]')){
    const base=doc.createElement('base');
    base.target='_top';
    base.dataset.kimWrapper='true';
    doc.head.prepend(base);
  }
  const oldButton=doc.getElementById('print-list');
  if(!oldButton)return;
  const button=oldButton.cloneNode(true);
  button.id='share-list';
  button.textContent='Senden';
  button.setAttribute('aria-label','Gemeinsame Einkaufsliste senden');
  oldButton.replaceWith(button);
  button.addEventListener('click',async()=>{
    const rows=[...doc.querySelectorAll('.shopping-item')];
    if(!rows.length){win.alert('Bitte zuerst eine gemeinsame Einkaufsliste erstellen.');return;}
    const lines=rows.map(row=>{
      const checked=row.querySelector('input[type="checkbox"]')?.checked;
      const name=row.querySelector('.item-name')?.textContent.trim()||'';
      const amount=row.querySelector('.item-amount')?.textContent.trim()||'';
      return `${checked?'☑':'☐'} ${name}${amount?` – ${amount}`:''}`;
    });
    const meta=doc.getElementById('result-meta')?.textContent.trim()||'';
    const summary=doc.getElementById('selection-summary')?.textContent.trim()||'';
    const text=['Gemeinsame Einkaufsliste',meta,summary,'',...lines].filter((line,index)=>line||index===3).join('\n');
    const data={title:'Gemeinsame Einkaufsliste',text,url:location.href};
    const nav=win.navigator;
    if(nav.share&&(!nav.canShare||nav.canShare(data))){
      try{await nav.share(data);return}catch(error){if(error?.name==='AbortError')return;}
    }
    try{
      if(nav.clipboard?.writeText){await nav.clipboard.writeText(text)}
      else{
        const area=doc.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';doc.body.appendChild(area);area.select();doc.execCommand('copy');area.remove();
      }
      win.alert('Die Einkaufsliste wurde kopiert. Du kannst sie jetzt in E-Mail, Nachrichten oder einer anderen App einfügen.');
    }catch{win.alert('Das Teilen wird von diesem Browser leider nicht unterstützt.');}
  });
});
</script>
</body>
</html>
