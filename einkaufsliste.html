const salsaData=`'salsa-verde':{title:'Salsa Verde',baseServings:4,page:'salsa-verde.html',backLabel:'Salsa Verde',ingredients:[{id:'petersilie-bund',name:'Glatte Petersilie',amount:1,unit:'Bund'},{id:'olivenoel',name:'Olivenöl',amount:4,unit:'EL'},{id:'zitronensaft',name:'Zitronensaft',amountMin:1,amountMax:2,unit:'TL'},{id:'knoblauch',name:'Knoblauchzehe',amount:0.5,unit:'Stück'},{id:'salz',name:'Salz',note:'nach Geschmack'}]}`;
const lammlachsData=`'lammlachse-klassisch':{title:'Lammlachse mit Rosmarin',baseServings:2,page:'lammlachse-klassisch.html',backLabel:'Lammlachse mit Rosmarin',ingredients:[{id:'lammlachse',name:'Lammlachse',amount:2,unit:'Stück',whole:true},{id:'olivenoel',name:'Olivenöl',amount:2,unit:'EL'},{id:'rosmarin-frisch',name:'Rosmarin, frisch',amount:2,unit:'Zweige',whole:true},{id:'thymian-frisch',name:'Thymian, frisch',amount:3,unit:'Zweige',whole:true},{id:'knoblauch',name:'Knoblauchzehen',amount:2,unit:'Stück',whole:true},{id:'butter',name:'Butter',amount:1,unit:'EL'},{id:'salz',name:'Meersalz',note:'nach Geschmack'},{id:'pfeffer',name:'Schwarzer Pfeffer',note:'nach Geschmack'}]}`;
const lambData=`'toskanisches-lammkarree':{title:'Toskanisches Lammkarree',baseServings:4,page:'toskanisches-lammkarree.html',backLabel:'Toskanisches Lammkarree',ingredients:[{id:'lammkarree',name:'Lammkarree',amount:4,unit:'Stück',whole:true},{id:'weisswein-trocken',name:'Trockener Weißwein',amount:0.2,unit:'l'},{id:'wermut',name:'Wermut',amount:6,unit:'cl'},{id:'honig',name:'Honig',amount:2,unit:'EL'},{id:'kartoffeln-festkochend',name:'Kartoffeln, festkochend',amount:12,unit:'Stück',whole:true},{id:'fruehlingszwiebeln',name:'Frühlingszwiebeln',amount:8,unit:'Stück',whole:true},{id:'rapsoel',name:'Rapsöl',amount:2,unit:'EL'},{id:'rosmarin-getrocknet',name:'Rosmarin, getrocknet',amount:8,unit:'EL'},{id:'thymian-getrocknet',name:'Thymian, getrocknet',amount:8,unit:'EL'},{id:'salbei-getrocknet',name:'Salbei, getrocknet',amount:2,unit:'EL'},{id:'knoblauch-granuliert',name:'Knoblauch, granuliert',amount:4,unit:'EL'},{id:'zwiebel-granuliert',name:'Zwiebel, granuliert',amount:4,unit:'EL'},{id:'chilipulver',name:'Chilipulver',amount:2,unit:'EL'},{id:'salz',name:'Salz',amount:4,unit:'EL'}]}`;

async function init(){
  try{
    let html=await fetch('einkaufsliste-basis.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Basisdatei nicht erreichbar');return r.text()});
    const grillPattern=/'grillgemuese-gasgrill':\{[\s\S]*?\},\n'finishing-sauce-grillgemuese-haehnchen'/;
    if(!grillPattern.test(html))throw new Error('Grillgemüse-Daten nicht gefunden');
    html=html.replace(grillPattern,grillData+",\n"+chickenData+",\n"+beerChickenData+",\n"+lambData+",\n"+ibericoData+",\n"+salsaData+",\n"+lammlachsData+",\n'finishing-sauce-grillgemuese-haehnchen'");
    if(!html.includes('href="chicken-asado.html"'))html=html.replace('<a href="entrecote-steakhouse.html">Entrecôte Steakhouse</a>','<a href="chicken-asado.html">Chicken Asado</a><a href="beer-can-chicken.html">Beer Can Chicken</a><a href="toskanisches-lammkarree.html">Toskanisches Lammkarree</a><a href="entrecote-steakhouse.html">Entrecôte Steakhouse</a>');
    else{
      if(!html.includes('href="beer-can-chicken.html"'))html=html.replace('<a href="chicken-asado.html">Chicken Asado</a>','<a href="chicken-asado.html">Chicken Asado</a><a href="beer-can-chicken.html">Beer Can Chicken</a>');
      if(!html.includes('href="toskanisches-lammkarree.html"'))html=html.replace('<a href="beer-can-chicken.html">Beer Can Chicken</a>','<a href="beer-can-chicken.html">Beer Can Chicken</a><a href="toskanisches-lammkarree.html">Toskanisches Lammkarree</a>');
    }
    if(!html.includes('href="lammlachse-klassisch.html"'))html=html.replace('<a href="toskanisches-lammkarree.html">Toskanisches Lammkarree</a>','<a href="toskanisches-lammkarree.html">Toskanisches Lammkarree</a><a href="lammlachse-klassisch.html">Lammlachse mit Rosmarin</a>');
    html=html.replace(/<meta name="book-version" content="2.21.0"]+">/,'<meta name="book-version" content="2.21.0">');
    if(!html.includes('href="iberico-bellota-carre.html"'))html=html.replace('<a href="entrecote-steakhouse.html">Entrecôte Steakhouse</a>','<a href="iberico-bellota-carre.html">Ibérico Bellota Carré</a><a href="salsa-verde.html">Salsa Verde</a><a href="entrecote-steakhouse.html">Entrecôte Steakhouse</a>');
    html=html.replace('<form class="recalculate" id="recalculate-form" method="get">','<form class="recalculate" id="recalculate-form" method="get" action="einkaufsliste.html" target="_top">');
    html=html.replace('const params=new URLSearchParams(location.search);',`const params=new URLSearchParams(${JSON.stringify(location.search)});`);
    html=html.replace('</head>','<base href="./" target="_top" data-kim-wrapper="true"></head>');
    frame.addEventListener('load',installShare,{once:true});
    frame.srcdoc=html;
  }catch(error){
    frame.classList.add('ready');
    document.body.insertAdjacentHTML('beforeend','<p class="error">Die Einkaufsliste konnte nicht geladen werden.</p>');
    console.error(error);
  }
}

function setupPdfSharing(button, getData, printButton, win){
  button.disabled=true;
  button.textContent='PDF wird vorbereitet …';
  const script=document.createElement('script');
  script.src='assets/vendor/jspdf-2.5.1.umd.min.js';
  script.onload=()=>{button.disabled=false;button.textContent='PDF senden'};
  script.onerror=()=>{button.disabled=false;button.textContent='Drucken / PDF';button.title='PDF-Bibliothek nicht erreichbar; Druckdialog verwenden'};
  document.head.appendChild(script);
  const printable=printButton.cloneNode(true);
  printable.id='print-list-copy';printable.textContent='Drucken';
  button.after(printable);
  printable.addEventListener('click',()=>win.print());
  button.addEventListener('click',async()=>{
    const data=getData();
    if(!data.rows.length){win.alert('Bitte zuerst eine Einkaufsliste erstellen.');return}
    if(!window.jspdf){win.print();return}
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    const width=210,margin=18,right=width-margin;
    let y=24;
    pdf.setFont('helvetica','bold');pdf.setFontSize(20);pdf.text('Einkaufsliste',margin,y);
    y+=12;pdf.setFontSize(12);pdf.text(pdf.splitTextToSize(data.title,174),margin,y);y+=12;
    pdf.setFont('helvetica','normal');pdf.setFontSize(10);
    for(const info of data.meta){
      if(!info)continue;
      const parts=pdf.splitTextToSize(info,174);
      for(const part of parts){pdf.text(part,margin,y);y+=5}
    }
    y+=5;pdf.setDrawColor(205);pdf.line(margin,y,right,y);y+=9;
    pdf.setFontSize(11);
    let previousCategory='';
    for(const row of data.rows){
      if(row.category&&row.category!==previousCategory){if(y+12>277){pdf.addPage();y=24}y+=3;pdf.setFont('helvetica','bold');pdf.setFontSize(12);pdf.text(row.category,margin,y);y+=9;pdf.setFont('helvetica','normal');pdf.setFontSize(11);previousCategory=row.category}
      const label=(row.checked?'[x] ':'[ ] ')+row.name+(row.amount?'  -  '+row.amount:'');
      const parts=pdf.splitTextToSize(label,174);
      if(y+Math.max(7,parts.length*5)>277){pdf.addPage();y=24}
      for(const part of parts){pdf.text(part,margin,y);y+=5.5}
      y+=3;
    }
    pdf.setFontSize(9);pdf.setTextColor(115);
    pdf.text('Haralds Grillkochbuch',margin,285);
    const filename='Einkaufsliste-'+(data.title.toLowerCase().replace(/[^a-z0-9äöüß]+/g,'-').replace(/^-|-$/g,'')||'grillkochbuch')+'.pdf';
    const blob=pdf.output('blob');
    const file=new File([blob],filename,{type:'application/pdf'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'Einkaufsliste als PDF'});return}
      catch(error){if(error?.name==='AbortError')return}
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    win.alert('Die Einkaufsliste wurde als PDF gespeichert. Du kannst diese Datei nun als Anhang versenden.');
  });
}


async function createSnapshotUrl(data){
  const payload={v:1,t:String(data.title||'Einkaufsliste'),m:(data.meta||[]).map(String),r:data.rows.map(r=>[String(r.name||''),String(r.amount||''),!!r.checked,String(r.category||'Öle, Gewürze & Vorrat')])};
  let bytes=new TextEncoder().encode(JSON.stringify(payload)),mode='b';
  if('CompressionStream' in window){
    try{
      const zipped=await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
      if(zipped.byteLength<bytes.byteLength){bytes=new Uint8Array(zipped);mode='z'}
    }catch(error){console.warn('Komprimierung nicht verfügbar',error)}
  }
  let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
  return new URL('einkaufsliste-ansicht.html',location.href).href+'#'+mode+btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function setupLinkSharing(pdfButton,getData,win){
 const button=pdfButton.cloneNode(true);
 button.id='link-send-button';button.disabled=false;button.textContent='Link senden';button.setAttribute('aria-label','Fertige Einkaufsliste als Link senden');
 const print=document.getElementById('print-list-copy'); 
 pdfButton.after(button);
 button.addEventListener('click',async()=>{
   const data=getData();
   if(!data.rows.length){win.alert('Bitte zuerst eine Einkaufsliste erstellen.');return}
   try{
     const url=await createSnapshotUrl(data);
     // Der Link ist vollständig selbstenthaltend; keine Server-Speicherung.
     if(navigator.share){
       try{await navigator.share({title:'Einkaufsliste – '+data.title,url});return}
       catch(error){if(error?.name==='AbortError')return}
     }
     if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(url);win.alert('Link zur fertigen Einkaufsliste kopiert. Jetzt kannst du ihn verschicken.');return}
     win.prompt('Diesen Link zur fertigen Einkaufsliste kopieren:',url);
   }catch(error){win.alert('Der Link konnte nicht erstellt werden: '+error.message)}
 });
}

function installShare(){
 const doc=frame.contentDocument,win=frame.contentWindow;
 if(!doc||!win){frame.classList.add('ready');return}
 document.title=doc.title;
 const printButton=doc.getElementById('print-button');
 if(!printButton){frame.classList.add('ready');return}
 const button=printButton.cloneNode(true);
 button.id='pdf-send-button';button.setAttribute('aria-label','Einkaufsliste als PDF senden');
 printButton.replaceWith(button);
 setupPdfSharing(button,()=>{const rows=[...doc.querySelectorAll('.shopping-item')].map(row=>({checked:!!row.querySelector('input[type="checkbox"]')?.checked,name:row.querySelector('.name')?.textContent.trim()||'',category:row.closest('.shopping-group')?.querySelector('h3')?.textContent.trim()||'Öle, Gewürze & Vorrat',amount:row.querySelector('.amount')?.textContent.trim()||''}));
    return {title:doc.getElementById('recipe-title')?.textContent.trim()||'Rezept',meta:[doc.getElementById('list-meta')?.textContent.trim()||''],rows};},printButton,win);
 setupLinkSharing(button,()=>{const rows=[...doc.querySelectorAll('.shopping-item')].map(row=>({checked:!!row.querySelector('input[type="checkbox"]')?.checked,name:row.querySelector('.name')?.textContent.trim()||'',category:row.closest('.shopping-group')?.querySelector('h3')?.textContent.trim()||'Öle, Gewürze & Vorrat',amount:row.querySelector('.amount')?.textContent.trim()||''}));return {title:doc.getElementById('recipe-title')?.textContent.trim()||'Rezept',meta:[doc.getElementById('list-meta')?.textContent.trim()||''],rows};},win);
 frame.classList.add('ready');
}

init();
</script>
