name: Sync three recipe status
on:
  push:
    paths:
      - scripts/sync_three_recipes_status.trigger
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/sync_three_recipes_status.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/sync_three_recipes_status.py scripts/sync_three_recipes_status.trigger .github/workflows/sync-three-recipes-status.yml
          git add index.html 00_Projektstatus.md
          git commit -m "Einkaufslisten-Status für sieben Rezepte synchronisieren"
          git push
