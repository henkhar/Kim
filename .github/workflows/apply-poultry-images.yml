name: Apply poultry recipe images

on:
  push:
    paths:
      - '.github/apply-poultry-images.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify assets and integrate images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          chicken_img = Path('assets/Chicken_asado.jpg')
          beer_img = Path('assets/beer_can_chicken.jpg')
          if not chicken_img.exists():
              raise SystemExit('Missing asset: assets/Chicken_asado.jpg')
          if not beer_img.exists():
              raise SystemExit('Missing asset: assets/beer_can_chicken.jpg')

          BOOK_NEW = '2.15.2'

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f'{label}: pattern not found')
              return text.replace(old, new, 1)

          # Synchronize technical book-version metadata on all HTML pages.
          for page in root.glob('*.html'):
              text = page.read_text(encoding='utf-8')
              text = re.sub(r'<meta name="book-version" content="[^"]+">', f'<meta name="book-version" content="{BOOK_NEW}">', text, count=1)
              page.write_text(text, encoding='utf-8')

          hero_css_old = '.hero p{max-width:820px;margin:24px 0 0;color:var(--muted);font-size:1.12rem;line-height:1.55}.panel{'
          hero_css_new = '.hero p{max-width:820px;margin:24px 0 0;color:var(--muted);font-size:1.12rem;line-height:1.55}.hero-image{margin:0 0 24px;background:var(--surface);border-radius:34px;overflow:hidden;box-shadow:0 8px 30px #0000000d}.hero-image img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.hero-image figcaption{padding:14px 18px;color:var(--muted);font-size:.92rem;line-height:1.45;border-top:1px solid #ececef;background:var(--surface)}.panel{'

          recipes = [
              {
                  'path': 'chicken-asado.html',
                  'old_version': '0.1.1',
                  'new_version': '0.1.2',
                  'src': 'assets/Chicken_asado.jpg?v=2152',
                  'alt': 'Gegrilltes Chicken Asado mit kräftiger Kruste, Orange und Limette',
                  'caption': 'Serviervorschlag: saftiges Chicken Asado mit Orange-Limetten-Marinade und kräftigen Röstaromen.'
              },
              {
                  'path': 'beer-can-chicken.html',
                  'old_version': '0.1.0',
                  'new_version': '0.1.1',
                  'src': 'assets/beer_can_chicken.jpg?v=2152',
                  'alt': 'Knuspriges Beer Can Chicken auf einer Bierdose mit gerösteten Zwiebeln',
                  'caption': 'Serviervorschlag: knuspriges Beer Can Chicken mit gerösteten Zwiebeln und würzigem Bratensud.'
              }
          ]

          for recipe in recipes:
              text = read(recipe['path'])
              text = replace_once(text,
                  f'<meta name="recipe-version" content="{recipe["old_version"]}">',
                  f'<meta name="recipe-version" content="{recipe["new_version"]}">',
                  recipe['path'] + ' version')
              if '.hero-image{' not in text:
                  text = replace_once(text, hero_css_old, hero_css_new, recipe['path'] + ' hero css')
              if '@media(max-width:430px){.hero-image{' not in text:
                  text = replace_once(text, '@media(max-width:430px){.topbar', '@media(max-width:430px){.hero-image{border-radius:24px}.topbar', recipe['path'] + ' mobile hero')
              image_path = recipe['src'].split('?')[0]
              if image_path not in text:
                  figure = f'<figure class="hero-image"><img src="{recipe["src"]}" alt="{recipe["alt"]}" width="1672" height="941" loading="eager" fetchpriority="high" decoding="async"><figcaption>{recipe["caption"]}</figcaption></figure>'
                  text = replace_once(text, '</section>\n<section class="panel"><div class="facts">', '</section>\n' + figure + '\n<section class="panel"><div class="facts">', recipe['path'] + ' hero figure')
              write(recipe['path'], text)

          # Add both clickable thumbnails to the poultry category.
          text = read('fleisch.html')
          if '.recipe-gallery{' not in text:
              text = replace_once(text,
                  '.recipe-thumb:hover img{transform:scale(1.02)}.recipe-preview{',
                  '.recipe-thumb:hover img{transform:scale(1.02)}.recipe-gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}.recipe-gallery .recipe-thumb{margin:0}.recipe-preview{',
                  'fleisch gallery css')
              text = replace_once(text,
                  '@media(max-width:520px){.topbar',
                  '@media(max-width:520px){.recipe-gallery{grid-template-columns:1fr}.topbar',
                  'fleisch gallery mobile')
          old_article = '<article class="category" id="gefluegel"><div><h2>Geflügel</h2><p>Ganzes Hähnchen, Brust und Schenkel – saftig gegart und sicher auf den richtigen Garpunkt gebracht.</p></div><div class="recipe-preview"><a class="recipe-card-link" href="chicken-asado.html">Chicken Asado</a><a class="recipe-card-link" href="beer-can-chicken.html">Beer Can Chicken</a></div></article>'
          new_article = '<article class="category" id="gefluegel"><div><h2>Geflügel</h2><p>Ganzes Hähnchen, Brust und Schenkel – saftig gegart und sicher auf den richtigen Garpunkt gebracht.</p><div class="recipe-gallery"><a class="recipe-thumb" href="chicken-asado.html" aria-label="Chicken Asado öffnen"><img src="assets/Chicken_asado.jpg?v=2152" alt="Gegrilltes Chicken Asado mit Orange und Limette" width="1672" height="941" loading="lazy" decoding="async"></a><a class="recipe-thumb" href="beer-can-chicken.html" aria-label="Beer Can Chicken öffnen"><img src="assets/beer_can_chicken.jpg?v=2152" alt="Knuspriges Beer Can Chicken mit gerösteten Zwiebeln" width="1672" height="941" loading="lazy" decoding="async"></a></div></div><div class="recipe-preview"><a class="recipe-card-link" href="chicken-asado.html">Chicken Asado</a><a class="recipe-card-link" href="beer-can-chicken.html">Beer Can Chicken</a></div></article>'
          if 'assets/Chicken_asado.jpg' not in text or 'assets/beer_can_chicken.jpg' not in text:
              text = replace_once(text, old_article, new_article, 'fleisch poultry article')
          write('fleisch.html', text)

          # Synchronize embedded project state.
          text = read('index.html')
          text = text.replace('"bookVersion": "2.15.1"', '"bookVersion": "2.15.2"', 1)
          text = text.replace('{"id":"chicken-asado","title":"Chicken Asado","page":"chicken-asado.html","version":"0.1.1"', '{"id":"chicken-asado","title":"Chicken Asado","page":"chicken-asado.html","version":"0.1.2"', 1)
          text = text.replace('{"id":"beer-can-chicken","title":"Beer Can Chicken","page":"beer-can-chicken.html","version":"0.1.0"', '{"id":"beer-can-chicken","title":"Beer Can Chicken","page":"beer-can-chicken.html","version":"0.1.1"', 1)
          history_old = '    {"date":"2026-08-04","version":"2.15.0","change":"Rubrik Hähnchen in Geflügel umbenannt und Beer Can Chicken als neuntes Rezept ergänzt."},\n    {"date":"2026-08-04","version":"2.15.1","change":"Startseite vereinfacht: Einkaufsliste in die Hauptnavigation verschoben und drei untere Schnellzugriffe entfernt."}\n  ]'
          history_new = '    {"date":"2026-08-04","version":"2.15.0","change":"Rubrik Hähnchen in Geflügel umbenannt und Beer Can Chicken als neuntes Rezept ergänzt."},\n    {"date":"2026-08-04","version":"2.15.1","change":"Startseite vereinfacht: Einkaufsliste in die Hauptnavigation verschoben und drei untere Schnellzugriffe entfernt."},\n    {"date":"2026-08-04","version":"2.15.2","change":"Chicken Asado und Beer Can Chicken mit JPEG-Hero-Bildern und anklickbaren Geflügel-Thumbnails ergänzt."}\n  ]'
          text = replace_once(text, history_old, history_new, 'index history')
          write('index.html', text)

          # Synchronize dynamic project status.
          text = read('00_Projektstatus.md')
          text = text.replace('**Buchversion:** 2.15.1', '**Buchversion:** 2.15.2', 1)
          text = text.replace('- 7 Rezeptseiten mit Hero-Bild', '- 9 Rezeptseiten mit Hero-Bild', 1)
          text = text.replace('- Chicken Asado – Version 0.1.1 – `chicken-asado.html`', '- Chicken Asado – Version 0.1.2 – `chicken-asado.html`', 1)
          text = text.replace('- Beer Can Chicken – Version 0.1.0 – `beer-can-chicken.html`', '- Beer Can Chicken – Version 0.1.1 – `beer-can-chicken.html`', 1)
          text = text.replace('- Noch ohne Rezeptbild', '- Bild: `assets/beer_can_chicken.jpg`\n- Das Bild ist als Hero-Bild auf der Rezeptseite und als anklickbares Thumbnail in der Geflügel-Übersicht eingebunden.', 1)
          marker = '## Rubrik Geflügel\n'
          if '## Rezeptbilder Geflügel' not in text:
              block = '## Rezeptbilder Geflügel\n\n- Chicken Asado: `assets/Chicken_asado.jpg`\n- Beer Can Chicken: `assets/beer_can_chicken.jpg`\n- Beide JPEGs sind als 16:9-Hero-Bilder auf den Rezeptseiten und als anklickbare Thumbnails in der Geflügel-Kategorie eingebunden.\n\n'
              text = text.replace(marker, block + marker, 1)
          open_start = text.index('## Offene Aufgaben\n')
          open_end = text.index('## Verbindliche Hinweise\n')
          new_open = '''## Offene Aufgaben\n\n1. Beer Can Chicken gemeinsam testen und Garzeit sowie Gewürzmenge präzisieren.\n2. Chicken Asado gemeinsam testen und anschließend Mengen, Grillhitze und Gesamtgrillzeit präzisieren.\n3. Grillgemüse gemeinsam testen und später auf Version 1.0.0 setzen.\n4. Honig-Senf-Lachs und Gemüsefinish-Mild gemeinsam prüfen.\n5. Weitere Salate, Beilagen und vegane Rezepte ergänzen.\n6. Übergangsseite `kochbuch.html` später reduzieren oder auflösen.\n\n'''
          text = text[:open_start] + new_open + text[open_end:]
          hist_marker = '## Änderungshistorie\n\n'
          if '### Version 2.15.2' not in text:
              hist = '### Version 2.15.2 – 04.08.2026\n\n- vorhandene JPEG-Dateien `assets/Chicken_asado.jpg` und `assets/beer_can_chicken.jpg` geprüft und eingebunden\n- beide Geflügelrezepte mit 16:9-Hero-Bild, Alt-Text und Bildunterschrift ergänzt\n- Geflügel-Übersicht mit zwei anklickbaren, lazy-geladenen Thumbnails erweitert\n- interne Rezeptversionen auf 0.1.2 beziehungsweise 0.1.1 erhöht\n- Buchversion auf 2.15.2 erhöht\n\n'
              text = text.replace(hist_marker, hist_marker + hist, 1)
          write('00_Projektstatus.md', text)

          # Remove temporary workflow and trigger from the resulting commit.
          for temp in (Path('.github/workflows/apply-poultry-images.yml'), Path('.github/apply-poultry-images.trigger')):
              if temp.exists():
                  temp.unlink()
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "Chefkoch Kim"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Geflügelbilder korrekt einbauen"
          git push
