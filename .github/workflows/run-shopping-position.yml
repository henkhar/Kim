name: Run shopping panel position

on:
  push:
    paths:
      - trigger-shopping-position.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply position change
        run: python scripts/move-shopping-position.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-shopping-position.yml
          git rm .github/workflows/run-shopping-position.yml
          git rm scripts/move-shopping-position.py
          git rm trigger-shopping-position.txt
          git add honig-senf-lachs.html grillgemuese.html finishing-sauce.html gemuesefinish-mild.html index.html 00_Meta-Kim.md 00_Projektstatus.md
          git commit -m "Einkaufslisten auf Rezeptseiten ans Ende verschieben"
          git push