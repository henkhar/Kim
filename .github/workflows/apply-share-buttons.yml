name: Apply shopping list share buttons

on:
  push:
    paths:
      - .github/workflows/apply-share-buttons.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace print buttons with native sharing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_required(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f'{label}: erwarteter Text nicht gefunden')
              return text.replace(old, new, 1)

          def update_json_script(text, script_id, updater):
              pattern = rf'(<script id="{re.escape(script_id)}" type="application/json">\n)(.*?)(\n</script>)'
              match = re.search(pattern, text, flags=re.S)
              if not match:
                  raise RuntimeError(f'JSON-Script {script_id} nicht gefunden')
              data = json.loads(match.group(2))
              updater(data)
              replacement = match.group(1) + json.dumps(data, ensure_ascii=False, indent=2) + match.group(3)
              return text[:match.start()] + replacement + text[match.end():]

          single_share = r'''async function copyShoppingText(text){try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text)}else{const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove()}alert('Die Einkaufsliste wurde kopiert. Du kannst sie jetzt in E-Mail, Nachrichten oder einer anderen App einfügen.')}catch{alert('Das Teilen wird von diesem Browser leider nicht unterstützt.')}}async function shareShoppingList(){const rows=[...content.querySelectorAll('.shopping-item')];if(!rows.length){alert('Es ist noch keine Einkaufsliste vorhanden.');return}const lines=rows.map(row=>{const box=row.querySelector('input[type=checkbox]');const name=row.querySelector('.name')?.textContent.trim()||'';const amount=row.querySelector('.amount')?.textContent.trim()||'';return `${box?.checked?'☑':'☐'} ${name}${amount?` – ${amount}`:''}`});const heading=recipe?.title||'Einkaufsliste';const people=`${servings} ${servings===1?'Person':'Personen'}`;const text=[`Einkaufsliste: ${heading}`,people,'',...lines].join('\n');const data={title:`Einkaufsliste – ${heading}`,text,url:location.href};if(navigator.share&&(!navigator.canShare||navigator.canShare(data))){try{await navigator.share(data);return}catch(error){if(error&&error.name==='AbortError')return}}await copyShoppingText(text)}document.getElementById('share-button').addEventListener('click',shareShoppingList);'''

          path = 'einkaufsliste.html'
          text = load(path)
          text = replace_required(text, '<button class="action-button" id="print-button" type="button">Liste drucken</button>', '<button class="action-button" id="share-button" type="button" aria-label="Einkaufsliste senden">Senden</button>', 'Einzelrezept-Button')
          text = replace_required(text, "document.getElementById('print-button').addEventListener('click',()=>window.print());", single_share, 'Einzelrezept-JavaScript')
          text = text.replace('Chefkoch Kim · Einkaufsliste · Version 2.10.0', 'Chefkoch Kim · Einkaufsliste · Version 2.11.1')
          text = text.replace('Chefkoch Kim · Einkaufsliste · Version 2.11.0', 'Chefkoch Kim · Einkaufsliste · Version 2.11.1')
          save(path, text)

          combined_share = r'''async function copyShoppingText(text){try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text)}else{const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove()}alert('Die Einkaufsliste wurde kopiert. Du kannst sie jetzt in E-Mail, Nachrichten oder einer anderen App einfügen.')}catch{alert('Das Teilen wird von diesem Browser leider nicht unterstützt.')}}async function shareCombinedList(){const rows=[...content.querySelectorAll('.shopping-item')];if(!rows.length){alert('Bitte zuerst eine gemeinsame Einkaufsliste erstellen.');return}const lines=rows.map(row=>{const box=row.querySelector('input[type=checkbox]');const name=row.querySelector('.item-name')?.textContent.trim()||'';const amount=row.querySelector('.item-amount')?.textContent.trim()||'';return `${box?.checked?'☑':'☐'} ${name}${amount?` – ${amount}`:''}`});const details=[meta.textContent.trim(),summary.textContent.trim()].filter(Boolean);const text=['Gemeinsame Einkaufsliste',...details,'',...lines].join('\n');const data={title:'Gemeinsame Einkaufsliste',text,url:location.href};if(navigator.share&&(!navigator.canShare||navigator.canShare(data))){try{await navigator.share(data);return}catch(error){if(error&&error.name==='AbortError')return}}await copyShoppingText(text)}document.getElementById('share-list').onclick=shareCombinedList;'''

          path = 'einkaufsliste-gesamt.html'
          text = load(path)
          text = replace_required(text, '<button class="button" id="print-list" type="button">Liste drucken</button>', '<button class="button" id="share-list" type="button" aria-label="Gemeinsame Einkaufsliste senden">Senden</button>', 'Gesamtliste-Button')
          text = replace_required(text, "document.getElementById('print-list').onclick=()=>print();", combined_share, 'Gesamtliste-JavaScript')
          text = text.replace('Chefkoch Kim · Gemeinsame Einkaufsliste · Version 2.11.0', 'Chefkoch Kim · Gemeinsame Einkaufsliste · Version 2.11.1')
          save(path, text)

          path = 'index.html'
          text = load(path)
          rule = 'Einkaufslisten verwenden für „Senden“ die Web Share API des Geräts; wenn sie nicht verfügbar ist, wird die formatierte Liste in die Zwischenablage kopiert.'
          def update_meta(data):
              rules = data.setdefault('websiteRules', [])
              if rule not in rules:
                  rules.append(rule)
          def update_state(data):
              data['bookVersion'] = '2.11.1'
              for page in data.get('pages', []):
                  if page.get('path') == 'einkaufsliste.html':
                      page['status'] = 'aktiv für alle vier Einzelrezepte mit nativer Senden-Funktion'
                  if page.get('path') == 'einkaufsliste-gesamt.html':
                      page['status'] = 'aktiv mit Zutatenkumulierung und nativer Senden-Funktion'
              if not any(item.get('version') == '2.11.1' for item in data.get('history', [])):
                  data.setdefault('history', []).append({'date':'2026-08-02','version':'2.11.1','change':'Druckbuttons der Einzel- und Gesamteinkaufsliste durch eine Senden-Funktion über das native Teilen-Menü ersetzt; bei fehlender Browserunterstützung wird die formatierte Liste kopiert.'})
          text = update_json_script(text, 'chefkoch-kim-meta', update_meta)
          text = update_json_script(text, 'chefkoch-kim-state', update_state)
          text = text.replace('2026 · Chefkoch Kim · Version 2.11.0', '2026 · Chefkoch Kim · Version 2.11.1')
          save(path, text)

          path = '00_Meta-Kim.md'
          text = load(path)
          meta_rule = '- Einkaufslisten verwenden für den Button **Senden** nach Möglichkeit die Web Share API und damit das native Teilen-Menü des Geräts. Ist diese Funktion im Browser nicht verfügbar, wird die formatierte Liste als Fallback in die Zwischenablage kopiert.'
          if meta_rule not in text:
              marker = '- Gemeinsame Einkaufslisten verwenden dauerhafte interne Zutaten-IDs. Gleiche Zutaten werden nur bei kompatibler Bedeutung und kompatiblen Einheiten kumuliert; Volumenangaben werden intern normiert und anschließend wieder küchentauglich ausgegeben.\n'
              if marker not in text:
                  raise RuntimeError('Meta-Marker nicht gefunden')
              text = text.replace(marker, marker + meta_rule + '\n', 1)
          save(path, text)

          path = '00_Projektstatus.md'
          text = load(path)
          text = text.replace('**Buchversion:** 2.11.0', '**Buchversion:** 2.11.1')
          text = text.replace('- Druckansicht blendet Bedienelemente und bereits abgehakte Zutaten aus', '- der Button **Senden** öffnet auf unterstützten Geräten das native Teilen-Menü mit E-Mail, Nachrichten und installierten Apps')
          text = text.replace('- Zutaten lassen sich abhaken und die Liste kann gedruckt werden', '- Zutaten lassen sich abhaken und die Liste kann über den Button **Senden** weitergegeben werden')
          fallback = '- ist das native Teilen-Menü im verwendeten Browser nicht verfügbar, wird die formatierte Liste automatisch in die Zwischenablage kopiert\n'
          if fallback not in text:
              marker = '- Zutaten lassen sich abhaken und die Liste kann über den Button **Senden** weitergegeben werden\n'
              if marker in text:
                  text = text.replace(marker, marker + fallback, 1)
          completed = '- Druckbuttons der Einzel- und Gesamteinkaufsliste durch **Senden** ersetzt\n- natives Teilen-Menü über die Web Share API eingebunden\n- Zwischenablage als Fallback für nicht unterstützte Browser ergänzt\n- Buchversion auf 2.11.1 erhöht\n'
          if completed not in text:
              marker = '- Buchversion auf 2.10.0 erhöht\n'
              if marker in text:
                  text = text.replace(marker, marker + completed, 1)
              else:
                  marker = '## Offene Aufgaben\n'
                  text = text.replace(marker, completed + '\n' + marker, 1)
          if '### Version 2.11.1' not in text:
              history = '''### Version 2.11.1 – 02.08.2026

- Buttons „Liste drucken“ in Einzel- und Gesamteinkaufsliste durch „Senden“ ersetzt
- natives Teilen-Menü des Geräts über die Web Share API eingebunden
- Einkaufsliste wird mit Rezeptauswahl, Personenzahl, Mengen und Abhakstatus als Text geteilt
- Fallback auf die Zwischenablage ergänzt, falls der Browser kein natives Teilen-Menü bereitstellt
- Buchversion auf 2.11.1 erhöht

'''
              text = text.replace('## Änderungshistorie\n', '## Änderungshistorie\n' + history, 1)
          save(path, text)
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('einkaufsliste.html','einkaufsliste-gesamt.html'):
              html = Path(name).read_text(encoding='utf-8')
              scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
              if len(scripts) != 1:
                  raise SystemExit(f'{name}: Seitenskript nicht eindeutig gefunden')
              Path('/tmp/' + name + '.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/einkaufsliste.html.js
          node --check /tmp/einkaufsliste-gesamt.html.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add einkaufsliste.html einkaufsliste-gesamt.html index.html 00_Meta-Kim.md 00_Projektstatus.md
          git commit -m "Einkaufslisten über natives Teilen-Menü senden"
          git push