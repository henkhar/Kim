name: Fix Lachs image

on:
  push:
    paths:
      - .github/workflows/fix-lachs-image.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract image and update recipe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          page = Path('honig-senf-lachs.html')
          text = page.read_text(encoding='utf-8')
          match = re.search(r'src="data:image/jpeg;base64,([^"]+)"', text, re.S)
          if not match:
              raise SystemExit('Kein eingebettetes JPEG gefunden.')

          encoded = re.sub(r'\s+', '', match.group(1))
          image = base64.b64decode(encoded, validate=True)
          if not image.startswith(b'\xff\xd8') or not image.endswith(b'\xff\xd9'):
              raise SystemExit('Die JPEG-Daten sind beschädigt.')

          Path('assets').mkdir(exist_ok=True)
          Path('assets/honig-senf-lachs.jpg').write_bytes(image)
          text = text[:match.start()] + 'src="assets/honig-senf-lachs.jpg?v=273"' + text[match.end():]
          page.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/honig-senf-lachs.jpg honig-senf-lachs.html
          git commit -m "Lachsbild als echte JPEG-Datei speichern"
          git push