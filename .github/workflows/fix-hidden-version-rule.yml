name: Fix hidden version rule

on:
  push:
    paths:
      - trigger-fix-hidden-version-rule.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align project status wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('00_Projektstatus.md')
          text = path.read_text(encoding='utf-8')
          old = 'Rezeptkarten auf Übersichtsseiten zeigen keine farbigen Status- oder Informations-Pills. Arbeitsstand, Portionen und Rezeptstatus bleiben auf den Rezeptseiten beziehungsweise in den internen Projektdateien dokumentiert.'
          new = 'Rezeptkarten und Rezeptseiten zeigen keine internen Status- oder Versionshinweise. Arbeitsstand, Rezeptstatus und Versionsnummern bleiben ausschließlich in technischen Meta-Daten und den internen Projektdateien dokumentiert.'
          if old not in text:
              raise RuntimeError('Alte Projektstatus-Formulierung nicht gefunden')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-hidden-version-rule.yml trigger-fix-hidden-version-rule.txt
          git add 00_Projektstatus.md
          git commit -m "Interne Versionsregel angleichen"
          git push
