name: Apply shopping list pilot

on:
  push:
    paths:
      - .github/workflows/apply-shopping-list-pilot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update recipe and project status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def update_json_script(text, script_id, updater):
              pattern = rf'(<script id="{re.escape(script_id)}" type="application/json">\n)(.*?)(\n</script>)'
              match = re.search(pattern, text, flags=re.S)
              if not match:
                  raise RuntimeError(f'JSON-Script {script_id} nicht gefunden')
              data = json.loads(match.group(2))
              updater(data)
              replacement = match.group(1) + json.dumps(data, ensure_ascii=False, indent=2) + match.group(3)
              return text[:match.start()] + replacement + text[match.end():]

          path = 'honig-senf-lachs.html'
          text = load(path)
          shopping_css = (
              '.shopping-panel{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,5vw,56px);align-items:end}'
              '.shopping-copy h2{margin-bottom:14px}.shopping-copy p:last-child{margin:0;color:var(--muted);line-height:1.55}'
              '.shopping-eyebrow{margin:0 0 10px;color:var(--accent);font-size:.76rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase}'
              '.shopping-form{display:grid;grid-template-columns:minmax(150px,.72fr) minmax(210px,1fr);gap:14px;align-items:end}'
              '.shopping-field{display:grid;gap:7px;font-weight:650}.shopping-field span{font-size:.86rem}'
              '.shopping-field input{width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit;font-size:1rem}'
              '.shopping-field input:focus{outline:3px solid #bc4b2d22;border-color:var(--accent)}'
              '.shopping-option{min-height:48px;display:flex;align-items:center;gap:10px;padding:0 4px;color:var(--muted);font-size:.92rem;line-height:1.35}'
              '.shopping-option input{width:20px;height:20px;accent-color:var(--accent)}'
              '.shopping-button{grid-column:1/-1;min-height:50px;border:0;border-radius:15px;background:var(--ink);color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:transform .18s ease,opacity .18s ease}'
              '.shopping-button:hover,.shopping-button:focus-visible{opacity:.88;outline:none}.shopping-button:active{transform:scale(.99)}'
          )
          if '.shopping-panel{' not in text:
              text = text.replace('.panel{margin-bottom:22px;', shopping_css + '.panel{margin-bottom:22px;', 1)
              text = text.replace('@media(max-width:760px){', '@media(max-width:760px){.shopping-panel{grid-template-columns:1fr}.shopping-form{grid-template-columns:1fr}.shopping-button{width:100%}', 1)

          shopping_block = (
              '<section class="panel shopping-panel" aria-labelledby="shopping-title">\n'
              '<div class="shopping-copy"><p class="shopping-eyebrow">Einkauf planen</p><h2 id="shopping-title">Einkaufsliste erstellen</h2><p>Personenzahl auswählen, optionale Zutaten festlegen und anschließend eine eigene Liste zum Abhaken oder Drucken öffnen.</p></div>\n'
              '<form class="shopping-form" action="einkaufsliste.html" method="get">\n'
              '<input type="hidden" name="recipe" value="honig-senf-lachs-grill">\n'
              '<label class="shopping-field" for="shopping-servings"><span>Für wie viele Personen?</span><input id="shopping-servings" name="servings" type="number" min="1" max="20" step="1" value="4" inputmode="numeric" required></label>\n'
              '<input type="hidden" name="optional" value="0">\n'
              '<label class="shopping-option"><input type="checkbox" name="optional" value="1" checked>Optionale Zutaten aufnehmen</label>\n'
              '<button class="shopping-button" type="submit">Einkaufsliste erstellen</button>\n'
              '</form>\n'
              '</section>\n'
          )
          if 'id="shopping-title"' not in text:
              facts = re.search(r'(<section class="panel"><div class="facts">.*?</div></section>\n)', text, flags=re.S)
              if not facts:
                  raise RuntimeError('Faktenbereich auf der Lachsseite nicht gefunden')
              text = text[:facts.end()] + shopping_block + text[facts.end():]
          text = text.replace('Version 0.1.6 · weboptimiertes JPEG-Rezeptbild eingebunden.', 'Version 0.1.7 · Pilotfunktion für eine mengenberechnete Einkaufsliste ergänzt.')
          text = text.replace('Version 0.1.6', 'Version 0.1.7')
          save(path, text)

          path = 'index.html'
          text = load(path)

          def update_state(data):
              data['bookVersion'] = '2.9.0'
              data['lastUpdated'] = '2026-08-02'
              for page in data.get('pages', []):
                  if page.get('path') == 'honig-senf-lachs.html':
                      page['status'] = 'Arbeitsfassung mit Rezeptbild, Thumbnail und Einkaufsliste-Pilot'
              if not any(page.get('path') == 'einkaufsliste.html' for page in data.get('pages', [])):
                  data.setdefault('pages', []).append({'path':'einkaufsliste.html','role':'Dynamische Einkaufsliste mit Mengenberechnung, Abhaken und Druckansicht','status':'Pilot für Honig-Senf-Lachs'})
              for recipe_data in data.get('recipes', []):
                  if recipe_data.get('id') == 'honig-senf-lachs-grill':
                      recipe_data['version'] = '0.1.7'
              task = 'Einkaufsliste nach erfolgreichem Lachs-Pilot auf weitere Rezepte und später auf mehrere Rezepte gleichzeitig erweitern.'
              if task not in data.get('openTasks', []):
                  data.setdefault('openTasks', []).append(task)
              if not any(entry.get('version') == '2.9.0' for entry in data.get('history', [])):
                  data.setdefault('history', []).append({'date':'2026-08-02','version':'2.9.0','change':'Pilot-Einkaufsliste für den Honig-Senf-Lachs ergänzt: Personenzahl, optionale Zutaten, Mengenberechnung, Abhaken, lokale Speicherung und Druckansicht.'})

          text = update_json_script(text, 'chefkoch-kim-state', update_state)
          text = re.sub(r'(Chefkoch Kim · Version )\d+\.\d+\.\d+', r'\g<1>2.9.0', text)
          save(path, text)

          path = '00_Projektstatus.md'
          text = load(path)
          body, history = text.split('## Änderungshistorie', 1)
          body = re.sub(r'\*\*Buchversion:\*\* \d+\.\d+\.\d+', '**Buchversion:** 2.9.0', body, count=1)
          if '- `einkaufsliste.html` – Pilotseite' not in body:
              body = body.replace('- `kochbuch.html` – Übergangsseite für die frühere Gesamtansicht', '- `einkaufsliste.html` – Pilotseite für mengenberechnete Einkaufslisten\n- `kochbuch.html` – Übergangsseite für die frühere Gesamtansicht')
          if '- 1 Einkaufsliste-Pilotseite' not in body:
              body = body.replace('- 1 Übergangsseite für die frühere Gesamtansicht', '- 1 Einkaufsliste-Pilotseite mit Mengenberechnung und Druckansicht\n- 1 Übergangsseite für die frühere Gesamtansicht')
          body = body.replace('Honig-Senf-Lachs vom Grill – Arbeitsfassung, Version 0.1.6, Seite', 'Honig-Senf-Lachs vom Grill – Arbeitsfassung, Version 0.1.7, Seite')
          body = body.replace('- Version: 0.1.6', '- Version: 0.1.7', 1)
          body = body.replace('Grillgemüse – Rubrik Salate & Gemüse, Arbeitsfassung, Version 0.9.2, Seite', 'Grillgemüse – Rubrik Salate & Gemüse, Arbeitsfassung, Version 0.9.3, Seite')
          shopping_section = (
              '## Einkaufsliste – Pilot\n\n'
              'Die erste Einkaufsliste ist für den **Honig-Senf-Lachs vom Grill** umgesetzt.\n\n'
              '- Button und Personenauswahl direkt auf `honig-senf-lachs.html`\n'
              '- automatische Umrechnung ausgehend von 4 Personen\n'
              '- optionale Zutaten können ein- oder ausgeschlossen werden\n'
              '- eigene Seite `einkaufsliste.html`\n'
              '- Zutaten lassen sich abhaken\n'
              '- Häkchen werden lokal im Browser gespeichert\n'
              '- Druckansicht blendet Bedienelemente und bereits abgehakte Zutaten aus\n'
              '- derzeit bewusst nur ein Rezept; eine gemeinsame Liste für mehrere Rezepte folgt erst nach erfolgreichem Test\n\n'
          )
          if '## Einkaufsliste – Pilot' not in body:
              body = body.replace('## Kategorien und Hauptbereiche', shopping_section + '## Kategorien und Hauptbereiche', 1)
          if '- Einkaufsliste-Pilot für den Honig-Senf-Lachs umgesetzt' not in body:
              body = body.replace('## Offene Aufgaben', '- Einkaufsliste-Pilot für den Honig-Senf-Lachs umgesetzt\n- Personenzahl, optionale Zutaten, Mengenberechnung, Abhaken, lokale Speicherung und Druckansicht ergänzt\n- Rezeptversion Honig-Senf-Lachs auf 0.1.7 erhöht\n- Buchversion auf 2.9.0 erhöht\n\n## Offene Aufgaben', 1)
          if 'Einkaufsliste nach erfolgreichem Pilot' not in body:
              body = body.replace('## Offene Aufgaben\n', '## Offene Aufgaben\n\n1. Einkaufsliste nach erfolgreichem Pilot auf weitere Rezepte und später mehrere Rezepte gleichzeitig erweitern.\n', 1)
          history_entry = (
              '\n### Version 2.9.0 – 02.08.2026\n\n'
              '- Einkaufsliste-Pilot für den Honig-Senf-Lachs ergänzt\n'
              '- Personenzahl direkt auf der Rezeptseite auswählbar\n'
              '- Zutatenmengen automatisch von der Grundmenge für 4 Personen umgerechnet\n'
              '- optionale Zutaten ein- und ausschaltbar\n'
              '- neue Seite `einkaufsliste.html` mit Abhakfunktion, lokaler Speicherung, Zurücksetzen und Druckansicht\n'
              '- Rezeptversion Honig-Senf-Lachs auf 0.1.7 erhöht\n'
              '- Buchversion auf 2.9.0 erhöht\n'
          )
          if '### Version 2.9.0' not in history:
              history = history_entry + history
          save(path, body + '## Änderungshistorie' + history)
          Path('.github/workflows/apply-shopping-list-pilot.yml').unlink(missing_ok=True)
          PY

          git config user.name "Chefkoch Kim"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Einkaufsliste-Pilot für Honig-Senf-Lachs ergänzen"
          git push
