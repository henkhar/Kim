name: Apply shopping list pilot

on:
  push:
    paths:
      - .github/workflows/apply-shopping-list-pilot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build shopping list pilot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def update_json_script(text, script_id, updater):
              pattern = rf'(<script id="{re.escape(script_id)}" type="application/json">\n)(.*?)(\n</script>)'
              match = re.search(pattern, text, flags=re.S)
              if not match:
                  raise RuntimeError(f'JSON-Script {script_id} nicht gefunden')
              data = json.loads(match.group(2))
              updater(data)
              replacement = match.group(1) + json.dumps(data, ensure_ascii=False, indent=2) + match.group(3)
              return text[:match.start()] + replacement + text[match.end():]

          # 1) Lachs-Rezeptseite: Eingabe und Button ergänzen.
          path = 'honig-senf-lachs.html'
          text = load(path)

          shopping_css = (
              '.shopping-panel{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,5vw,56px);align-items:end}'
              '.shopping-copy h2{margin-bottom:14px}.shopping-copy p:last-child{margin:0;color:var(--muted);line-height:1.55}'
              '.shopping-eyebrow{margin:0 0 10px;color:var(--accent);font-size:.76rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase}'
              '.shopping-form{display:grid;grid-template-columns:minmax(150px,.72fr) minmax(210px,1fr);gap:14px;align-items:end}'
              '.shopping-field{display:grid;gap:7px;font-weight:650}.shopping-field span{font-size:.86rem}'
              '.shopping-field input{width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit;font-size:1rem}'
              '.shopping-field input:focus{outline:3px solid #bc4b2d22;border-color:var(--accent)}'
              '.shopping-option{min-height:48px;display:flex;align-items:center;gap:10px;padding:0 4px;color:var(--muted);font-size:.92rem;line-height:1.35}'
              '.shopping-option input{width:20px;height:20px;accent-color:var(--accent)}'
              '.shopping-button{grid-column:1/-1;min-height:50px;border:0;border-radius:15px;background:var(--ink);color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:transform .18s ease,opacity .18s ease}'
              '.shopping-button:hover,.shopping-button:focus-visible{opacity:.88;outline:none}.shopping-button:active{transform:scale(.99)}'
          )
          if '.shopping-panel{' not in text:
              text = text.replace('.panel{margin-bottom:22px;', shopping_css + '.panel{margin-bottom:22px;', 1)
              text = text.replace('@media(max-width:760px){', '@media(max-width:760px){.shopping-panel{grid-template-columns:1fr}.shopping-form{grid-template-columns:1fr}.shopping-button{width:100%}', 1)

          shopping_block = '''<section class="panel shopping-panel" aria-labelledby="shopping-title">
<div class="shopping-copy"><p class="shopping-eyebrow">Einkauf planen</p><h2 id="shopping-title">Einkaufsliste erstellen</h2><p>Personenzahl auswählen, optionale Zutaten festlegen und anschließend eine eigene Liste zum Abhaken oder Drucken öffnen.</p></div>
<form class="shopping-form" action="einkaufsliste.html" method="get">
<input type="hidden" name="recipe" value="honig-senf-lachs-grill">
<label class="shopping-field" for="shopping-servings"><span>Für wie viele Personen?</span><input id="shopping-servings" name="servings" type="number" min="1" max="20" step="1" value="4" inputmode="numeric" required></label>
<input type="hidden" name="optional" value="0">
<label class="shopping-option"><input type="checkbox" name="optional" value="1" checked>Optionale Zutaten aufnehmen</label>
<button class="shopping-button" type="submit">Einkaufsliste erstellen</button>
</form>
</section>
'''
          if 'id="shopping-title"' not in text:
              facts = re.search(r'(<section class="panel"><div class="facts">.*?</div></section>\n)', text, flags=re.S)
              if not facts:
                  raise RuntimeError('Faktenbereich auf der Lachsseite nicht gefunden')
              text = text[:facts.end()] + shopping_block + text[facts.end():]

          text = text.replace('Version 0.1.6 · weboptimiertes JPEG-Rezeptbild eingebunden.', 'Version 0.1.7 · Pilotfunktion für eine mengenberechnete Einkaufsliste ergänzt.')
          text = text.replace('Version 0.1.6', 'Version 0.1.7')
          save(path, text)

          # 2) Neue Einkaufsliste als statische, browserbasierte Seite.
          shopping_page = r'''<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Einkaufsliste für Rezepte aus Haralds Grillkochbuch">
<title>Einkaufsliste · Haralds Grillkochbuch</title>
<style>
:root{--bg:#f5f5f7;--surface:#fff;--ink:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--accent:#bc4b2d;--soft:#f0f3ed}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}.page{min-height:100vh;display:flex;flex-direction:column}.topbar{position:sticky;top:0;z-index:10;min-height:64px;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:0 clamp(16px,4vw,48px);background:#ffffffe8;backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid #0000000d}.menu-button{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:50%;cursor:pointer}.menu-button:hover,.menu-button:focus-visible{background:#00000008;outline:none}.menu-icon,.menu-icon::before,.menu-icon::after{width:24px;height:2px;border-radius:999px;background:var(--ink);content:"";display:block}.menu-icon{position:relative}.menu-icon::before{position:absolute;top:-7px}.menu-icon::after{position:absolute;top:7px}.home-button{position:absolute;top:10px;left:calc(clamp(16px,4vw,48px) + 52px);width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:#f2f2f4;color:var(--ink);text-decoration:none}.home-button:hover,.home-button:focus-visible{background:#e8e8ed;outline:none}.home-button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.brand{text-align:center;font-size:1rem;font-weight:600;letter-spacing:-.01em}.wrap{width:min(960px,calc(100% - 32px));margin:auto}.hero{padding:clamp(72px,10vw,118px) 0 34px}.eyebrow{margin:0 0 14px;color:var(--accent);font-size:.78rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(3.8rem,9vw,7.7rem);line-height:.92;letter-spacing:-.075em}.hero p{max-width:730px;margin:22px 0 0;color:var(--muted);font-size:1.08rem;line-height:1.55}.panel{margin-bottom:22px;padding:clamp(24px,5vw,44px);border-radius:28px;background:var(--surface)}.controls{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}.controls h2{margin:0 0 8px;font-size:clamp(1.8rem,4vw,2.7rem);letter-spacing:-.045em}.controls p{margin:0;color:var(--muted);line-height:1.5}.recalculate{display:grid;grid-template-columns:130px minmax(190px,1fr);gap:12px;align-items:end}.field{display:grid;gap:7px;font-weight:650}.field span{font-size:.84rem}.field input[type=number]{height:46px;padding:0 13px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font:inherit}.option{min-height:46px;display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.9rem}.option input{width:19px;height:19px;accent-color:var(--accent)}.recalculate input[type=hidden]{display:none}.recalculate button,.action-button{min-height:48px;border:0;border-radius:14px;padding:0 18px;background:var(--ink);color:#fff;font:inherit;font-weight:700;cursor:pointer}.recalculate button{grid-column:1/-1}.list-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}.list-head h2{margin:0;font-size:clamp(2rem,5vw,3.4rem);line-height:1;letter-spacing:-.05em}.list-meta{color:var(--muted);font-size:.94rem}.shopping-list{display:grid;gap:10px}.shopping-item{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:14px;min-height:60px;padding:12px 16px;border:1px solid #ececef;border-radius:16px;background:#fafafa;cursor:pointer}.shopping-item:hover{background:#f5f5f7}.shopping-item input{width:21px;height:21px;accent-color:var(--accent)}.shopping-item .name{font-weight:600}.shopping-item .amount{color:var(--muted);text-align:right;white-space:nowrap}.shopping-item:has(input:checked){opacity:.55}.shopping-item:has(input:checked) .name,.shopping-item:has(input:checked) .amount{text-decoration:line-through}.optional-heading{margin:28px 0 10px;color:var(--muted);font-size:.78rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}.action-button.secondary{background:#ececf0;color:var(--ink)}.back-link{display:inline-flex;align-items:center;gap:8px;margin:4px 0 54px;color:var(--accent);text-decoration:none;font-weight:650}.back-link:hover,.back-link:focus-visible{text-decoration:underline}.notice{padding:20px;border-radius:16px;background:#fff3dc;color:#6d5325;line-height:1.5}footer{padding:20px 0 44px;text-align:center;color:var(--muted);font-size:.85rem}.drawer{position:fixed;inset:0 auto 0 0;width:min(340px,86vw);padding:30px;background:var(--surface);box-shadow:18px 0 50px #0002;transform:translateX(-110%);transition:transform .25s ease;z-index:20}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.drawer h2{margin:0;font-size:1.6rem;letter-spacing:-.03em}.close-button{width:40px;height:40px;border:0;border-radius:50%;background:#f2f2f4;font-size:1.4rem;cursor:pointer}.drawer nav{display:grid}.drawer a{padding:14px 0;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}.drawer a:hover,.drawer a:focus-visible{color:var(--accent)}.backdrop{position:fixed;inset:0;background:#0005;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:15}.backdrop.show{opacity:1;pointer-events:auto}@media(max-width:760px){.controls{grid-template-columns:1fr}.recalculate{grid-template-columns:1fr}.list-head{display:block}.list-meta{margin-top:10px}.shopping-item{grid-template-columns:24px minmax(0,1fr);}.shopping-item .amount{grid-column:2;text-align:left;white-space:normal}}@media(max-width:430px){.topbar{grid-template-columns:52px 1fr 52px;padding:0 8px}.home-button{left:60px}.brand{font-size:.9rem}.panel{padding:22px;border-radius:22px}.hero h1{font-size:clamp(3.5rem,15vw,5.6rem)}}
@media print{body{background:#fff}.topbar,.drawer,.backdrop,.hero p,.recalculate,.actions,.back-link,footer{display:none!important}.hero{padding:24px 0}.wrap{width:100%;max-width:none}.panel{padding:0;box-shadow:none}.shopping-item{break-inside:avoid;background:#fff}.shopping-item:has(input:checked){display:none}.shopping-item input{appearance:none;width:16px;height:16px;border:1.5px solid #333;border-radius:3px}.shopping-item .name,.shopping-item .amount{text-decoration:none!important}.list-meta{color:#333}}
</style>
</head>
<body>
<div class="page">
<header class="topbar"><button class="menu-button" type="button" aria-label="Menü öffnen" aria-expanded="false"><span class="menu-icon"></span></button><a class="home-button" href="index.html" aria-label="Zur Startseite" title="Startseite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.8l8.5 6.7"/><path d="M5.5 9.2V20h13V9.2"/><path d="M9.5 20v-6h5v6"/></svg></a><div class="brand">Haralds Grillkochbuch</div><div></div></header>
<main class="wrap">
<section class="hero"><p class="eyebrow">Pilotfunktion</p><h1>Einkaufs-<br>liste</h1><p>Die Mengen werden automatisch auf die gewählte Personenzahl umgerechnet. Abgehakte Artikel bleiben auf diesem Gerät gespeichert.</p></section>
<section class="panel controls"><div><h2 id="recipe-title">Honig-Senf-Lachs vom Grill</h2><p>Personenzahl oder optionale Zutaten können hier noch einmal angepasst werden.</p></div><form class="recalculate" method="get"><input type="hidden" name="recipe" value="honig-senf-lachs-grill"><label class="field"><span>Personen</span><input id="servings" name="servings" type="number" min="1" max="20" step="1" value="4" required></label><input type="hidden" name="optional" value="0"><label class="option"><input id="optional" type="checkbox" name="optional" value="1">Optionale Zutaten aufnehmen</label><button type="submit">Neu berechnen</button></form></section>
<section class="panel" aria-live="polite"><div class="list-head"><h2>Benötigte Zutaten</h2><div class="list-meta" id="list-meta"></div></div><div id="list-content"></div><div class="actions"><button class="action-button" id="print-button" type="button">Liste drucken</button><button class="action-button secondary" id="reset-button" type="button">Häkchen zurücksetzen</button></div></section>
<a class="back-link" href="honig-senf-lachs.html">← Zurück zum Honig-Senf-Lachs</a>
</main>
<footer>Chefkoch Kim · Einkaufsliste · Version 2.9.0</footer>
</div>
<aside class="drawer" aria-hidden="true"><div class="drawer-head"><h2>Menü</h2><button class="close-button" type="button" aria-label="Menü schließen">×</button></div><nav><a href="index.html">Startseite</a><a href="honig-senf-lachs.html">Honig-Senf-Lachs</a><a href="fleisch.html">Fleisch</a><a href="gemuese-salat.html">Salate &amp; Beilagen</a><a href="grundlagen.html">Grundlagen</a></nav></aside><div class="backdrop"></div>
<script>
const recipes={
  'honig-senf-lachs-grill':{
    title:'Honig-Senf-Lachs vom Grill',
    baseServings:4,
    page:'honig-senf-lachs.html',
    ingredients:[
      {id:'lachs',name:'Lachsfilets mit Haut',amount:4,unit:'Stück',whole:true},
      {id:'grober-senf',name:'Grober Senf',amount:1,unit:'EL'},
      {id:'mittelscharfer-senf',name:'Mittelscharfer Senf',amount:1,unit:'EL'},
      {id:'honig',name:'Honig',amount:1,unit:'EL'},
      {id:'olivenoel',name:'Olivenöl',amount:1,unit:'EL'},
      {id:'zitronensaft',name:'Zitronensaft',amount:1,unit:'TL'},
      {id:'salz-pfeffer',name:'Salz und Pfeffer',note:'nach Bedarf'},
      {id:'dill',name:'Dill',note:'sehr empfehlenswert',optional:true}
    ]
  }
};
const params=new URLSearchParams(location.search);const recipeId=params.get('recipe')||'honig-senf-lachs-grill';const recipe=recipes[recipeId];const rawServings=Number.parseInt(params.get('servings')||String(recipe?.baseServings||4),10);const servings=Number.isFinite(rawServings)?Math.min(20,Math.max(1,rawServings)):4;const includeOptional=params.getAll('optional').includes('1');const numberFormat=new Intl.NumberFormat('de-DE',{maximumFractionDigits:2});const title=document.getElementById('recipe-title');const meta=document.getElementById('list-meta');const content=document.getElementById('list-content');const servingsInput=document.getElementById('servings');const optionalInput=document.getElementById('optional');servingsInput.value=String(servings);optionalInput.checked=includeOptional;
function scaledAmount(item){const value=item.amount*(servings/recipe.baseServings);return item.whole?Math.ceil(value):Math.round(value*100)/100}
function amountText(item){if(item.amount==null)return item.note||'';return `${numberFormat.format(scaledAmount(item))} ${item.unit}`}
function storageKey(){return `chefkoch-kim:einkaufsliste:${recipeId}:${servings}:${includeOptional?'mit':'ohne'}-optional`}
function readState(){try{return JSON.parse(localStorage.getItem(storageKey())||'{}')}catch{return {}}}
function saveState(state){localStorage.setItem(storageKey(),JSON.stringify(state))}
function render(){if(!recipe){title.textContent='Rezept nicht gefunden';meta.textContent='';content.innerHTML='<p class="notice">Für diese Einkaufsliste wurden noch keine Rezeptdaten hinterlegt.</p>';return}title.textContent=recipe.title;meta.textContent=`${servings} ${servings===1?'Person':'Personen'}${includeOptional?' · inklusive optionaler Zutaten':''}`;const state=readState();const regular=recipe.ingredients.filter(item=>!item.optional);const optional=includeOptional?recipe.ingredients.filter(item=>item.optional):[];let html='<div class="shopping-list">';for(const item of regular){html+=itemRow(item,state)}html+='</div>';if(optional.length){html+='<p class="optional-heading">Optional</p><div class="shopping-list">';for(const item of optional){html+=itemRow(item,state)}html+='</div>'}content.innerHTML=html;content.querySelectorAll('input[type=checkbox]').forEach(box=>box.addEventListener('change',()=>{const next=readState();next[box.dataset.item]=box.checked;saveState(next)}))}
function itemRow(item,state){const checked=state[item.id]?' checked':'';return `<label class="shopping-item"><input type="checkbox" data-item="${item.id}"${checked}><span class="name">${item.name}</span><span class="amount">${amountText(item)}</span></label>`}
document.getElementById('print-button').addEventListener('click',()=>window.print());document.getElementById('reset-button').addEventListener('click',()=>{localStorage.removeItem(storageKey());render()});render();
const menuButton=document.querySelector('.menu-button');const closeButton=document.querySelector('.close-button');const drawer=document.querySelector('.drawer');const backdrop=document.querySelector('.backdrop');function setMenu(open){drawer.classList.toggle('open',open);backdrop.classList.toggle('show',open);drawer.setAttribute('aria-hidden',String(!open));menuButton.setAttribute('aria-expanded',String(open))}menuButton.addEventListener('click',()=>setMenu(!drawer.classList.contains('open')));closeButton.addEventListener('click',()=>setMenu(false));backdrop.addEventListener('click',()=>setMenu(false));document.addEventListener('keydown',event=>{if(event.key==='Escape')setMenu(false)});
</script>
</body>
</html>
'''
          save('einkaufsliste.html', shopping_page)

          # 3) Maschinenlesbaren Projektstatus in index.html aktualisieren.
          path = 'index.html'
          text = load(path)

          def update_state(data):
              data['bookVersion'] = '2.9.0'
              data['lastUpdated'] = '2026-08-02'
              for page in data.get('pages', []):
                  if page.get('path') == 'honig-senf-lachs.html':
                      page['status'] = 'Arbeitsfassung mit Rezeptbild, Thumbnail und Einkaufsliste-Pilot'
              if not any(page.get('path') == 'einkaufsliste.html' for page in data.get('pages', [])):
                  data.setdefault('pages', []).append({'path':'einkaufsliste.html','role':'Dynamische Einkaufsliste mit Mengenberechnung, Abhaken und Druckansicht','status':'Pilot für Honig-Senf-Lachs'})
              for recipe_data in data.get('recipes', []):
                  if recipe_data.get('id') == 'honig-senf-lachs-grill':
                      recipe_data['version'] = '0.1.7'
              task = 'Einkaufsliste nach erfolgreichem Lachs-Pilot auf weitere Rezepte und später auf mehrere Rezepte gleichzeitig erweitern.'
              if task not in data.get('openTasks', []):
                  data.setdefault('openTasks', []).append(task)
              if not any(entry.get('version') == '2.9.0' for entry in data.get('history', [])):
                  data.setdefault('history', []).append({'date':'2026-08-02','version':'2.9.0','change':'Pilot-Einkaufsliste für den Honig-Senf-Lachs ergänzt: Personenzahl, optionale Zutaten, Mengenberechnung, Abhaken, lokale Speicherung und Druckansicht.'})

          text = update_json_script(text, 'chefkoch-kim-state', update_state)
          text = re.sub(r'(Chefkoch Kim · Version )\d+\.\d+\.\d+', r'\g<1>2.9.0', text)
          save(path, text)

          # 4) Projektstatus dokumentieren, ohne alte Historie umzuschreiben.
          path = '00_Projektstatus.md'
          text = load(path)
          body, history = text.split('## Änderungshistorie', 1)
          body = re.sub(r'\*\*Buchversion:\*\* \d+\.\d+\.\d+', '**Buchversion:** 2.9.0', body, count=1)
          if '- `einkaufsliste.html` – Pilotseite' not in body:
              body = body.replace('- `kochbuch.html` – Übergangsseite für die frühere Gesamtansicht', '- `einkaufsliste.html` – Pilotseite für mengenberechnete Einkaufslisten\n- `kochbuch.html` – Übergangsseite für die frühere Gesamtansicht')
          if '- 1 Einkaufsliste-Pilotseite' not in body:
              body = body.replace('- 1 Übergangsseite für die frühere Gesamtansicht', '- 1 Einkaufsliste-Pilotseite mit Mengenberechnung und Druckansicht\n- 1 Übergangsseite für die frühere Gesamtansicht')
          body = body.replace('Honig-Senf-Lachs vom Grill – Arbeitsfassung, Version 0.1.6, Seite', 'Honig-Senf-Lachs vom Grill – Arbeitsfassung, Version 0.1.7, Seite')
          body = body.replace('- Version: 0.1.6', '- Version: 0.1.7', 1)
          body = body.replace('Grillgemüse – Rubrik Salate & Gemüse, Arbeitsfassung, Version 0.9.2, Seite', 'Grillgemüse – Rubrik Salate & Gemüse, Arbeitsfassung, Version 0.9.3, Seite')
          shopping_section = '''## Einkaufsliste – Pilot

Die erste Einkaufsliste ist für den **Honig-Senf-Lachs vom Grill** umgesetzt.

- Button und Personenauswahl direkt auf `honig-senf-lachs.html`
- automatische Umrechnung ausgehend von 4 Personen
- optionale Zutaten können ein- oder ausgeschlossen werden
- eigene Seite `einkaufsliste.html`
- Zutaten lassen sich abhaken
- Häkchen werden lokal im Browser gespeichert
- Druckansicht blendet Bedienelemente und bereits abgehakte Zutaten aus
- derzeit bewusst nur ein Rezept; eine gemeinsame Liste für mehrere Rezepte folgt erst nach erfolgreichem Test

'''
          if '## Einkaufsliste – Pilot' not in body:
              body = body.replace('## Kategorien und Hauptbereiche', shopping_section + '## Kategorien und Hauptbereiche', 1)
          if '- Einkaufsliste-Pilot für den Honig-Senf-Lachs umgesetzt' not in body:
              body = body.replace('## Offene Aufgaben', '- Einkaufsliste-Pilot für den Honig-Senf-Lachs umgesetzt\n- Personenzahl, optionale Zutaten, Mengenberechnung, Abhaken, lokale Speicherung und Druckansicht ergänzt\n- Rezeptversion Honig-Senf-Lachs auf 0.1.7 erhöht\n- Buchversion auf 2.9.0 erhöht\n\n## Offene Aufgaben', 1)
          if 'Einkaufsliste nach erfolgreichem Pilot' not in body:
