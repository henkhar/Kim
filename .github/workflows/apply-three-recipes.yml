name: Apply three new recipes

on:
  push:
    paths:
      - scripts/add_three_recipes.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recipe integration
        run: python scripts/add_three_recipes.py
      - name: Commit changes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/add_three_recipes.py scripts/add_three_recipes.trigger .github/workflows/apply-three-recipes.yml
          git add index.html 00_Meta-Kim.md 00_Projektstatus.md fleisch.html gemuese-salat.html einkaufsliste.html einkaufsliste-basis.html einkaufsliste-gesamt.html einkaufsliste-gesamt-basis.html *.html
          git commit -m "Drei neue Rezepte mit Einkaufslisten integrieren"
          git push
