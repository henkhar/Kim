name: Apply finish images

on:
  push:
    paths:
      - .github/workflows/apply-finish-images.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update finish recipe pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          hero_css = '.hero-image{margin:0 0 24px;background:var(--surface);border-radius:34px;overflow:hidden;box-shadow:0 8px 30px #0000000d}.hero-image img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.hero-image figcaption{padding:14px 18px;color:var(--muted);font-size:.92rem;line-height:1.45;border-top:1px solid #ececef;background:var(--surface)}'

          # Gemüsefinish-Fresh
          path = 'finishing-sauce.html'
          text = load(path)
          if '.hero-image{' not in text:
              text = text.replace('.panel{margin-bottom:22px;', hero_css + '.panel{margin-bottom:22px;', 1)
              text = text.replace('@media(max-width:430px){.topbar', '@media(max-width:430px){.hero-image{border-radius:24px}.topbar', 1)
          hero = '<section class="hero"><p class="eyebrow">Salate &amp; Beilagen · Soßen &amp; Finishes · Bestätigte Fassung</p><h1>Gemüsefinish-<br>Fresh</h1><p>Ein frisches, aromatisches Finish, das erst nach dem Grillen über das heiße Gemüse gegeben wird. Besonders gut als Gemüsebegleitung zu gegrilltem Hähnchen; ebenfalls passend zu Lachs und Steak.</p></section>\n'
          figure = '<figure class="hero-image"><img src="assets/gemuesefinish-fresh.jpg?v=281" alt="Gemüsefinish-Fresh mit Kräutern, Zitrone und gegrilltem Gemüse" width="1672" height="941" loading="eager" fetchpriority="high" decoding="async"><figcaption>Serviervorschlag: Gemüsefinish-Fresh mit Zitrone, Kräutern und Knoblauch zu frisch gegrilltem Gemüse.</figcaption></figure>\n'
          if 'assets/gemuesefinish-fresh.jpg' not in text:
              text = text.replace(hero, hero + figure, 1)
          text = text.replace('Version 1.0.2</b><span>Rezeptstand', 'Version 1.0.3</b><span>Rezeptstand')
          text = text.replace('Version 1.0.2 · Ölmenge reduziert, Knoblauch erhöht und die optionalen Aromaten feiner dosiert.', 'Version 1.0.3 · Rezeptbild im bestätigten 16:9-Hero-Stil ergänzt.')
          text = text.replace('Chefkoch Kim · Gemüsefinish-Fresh · Version 1.0.2', 'Chefkoch Kim · Gemüsefinish-Fresh · Version 1.0.3')
          save(path, text)

          # Gemüsefinish-Mild
          path = 'gemuesefinish-mild.html'
          text = load(path)
          if '.hero-image{' not in text:
              text = text.replace('.panel{margin-bottom:22px;', hero_css + '.panel{margin-bottom:22px;', 1)
              text = text.replace('@media(max-width:430px){.topbar', '@media(max-width:430px){.hero-image{border-radius:24px}.topbar', 1)
          hero = '<section class="hero"><p class="eyebrow">Salate &amp; Beilagen · Soßen &amp; Finishes</p><h1>Gemüsefinish-<br>Mild</h1><p>Ein zurückhaltendes Finish mit mildem Olivenöl, wenig Zitronensaft und Knoblauch. Thymian oder Rosmarin kommen nur sehr sparsam dazu.</p></section>\n'
          figure = '<figure class="hero-image"><img src="assets/gemuesefinish-mild.jpg?v=281" alt="Gemüsefinish-Mild mit dezenter Knoblauch- und Zitronennote zu gegrilltem Gemüse" width="1672" height="941" loading="eager" fetchpriority="high" decoding="async"><figcaption>Serviervorschlag: Gemüsefinish-Mild mit dezenter Knoblauch- und Zitronennote zu gegrilltem Gemüse.</figcaption></figure>\n'
          if 'assets/gemuesefinish-mild.jpg' not in text:
              text = text.replace(hero, hero + figure, 1)
          text = text.replace('Version 0.1.1 · Zubereitung an Gemüsefinish-Fresh angeglichen.', 'Version 0.1.2 · Rezeptbild im bestätigten 16:9-Hero-Stil ergänzt.')
          text = text.replace('Chefkoch Kim · Gemüsefinish-Mild · Version 0.1.1', 'Chefkoch Kim · Gemüsefinish-Mild · Version 0.1.2')
          save(path, text)

          # Salate & Beilagen: beide Finish-Thumbnails ergänzen.
          path = 'gemuese-salat.html'
          text = load(path)
          fresh_old = '<article class="recipe-card"><div><h3>Gemüsefinish-Fresh</h3><p>Ein frisches Finish mit Zitrone, Kräutern und Knoblauch, das erst nach dem Grillen über das heiße Gemüse gegeben wird.</p></div><a class="recipe-link"'
          fresh_new = '<article class="recipe-card"><div><h3>Gemüsefinish-Fresh</h3><p>Ein frisches Finish mit Zitrone, Kräutern und Knoblauch, das erst nach dem Grillen über das heiße Gemüse gegeben wird.</p><a class="card-thumb" href="finishing-sauce.html" aria-label="Gemüsefinish-Fresh öffnen"><img src="assets/gemuesefinish-fresh.jpg?v=281" alt="Gemüsefinish-Fresh mit Kräutern und gegrilltem Gemüse" width="1672" height="941" loading="lazy" decoding="async"></a></div><a class="recipe-link"'
          mild_old = '<article class="recipe-card"><div><h3>Gemüsefinish-Mild</h3><p>Ein zurückhaltendes Finish mit mildem Olivenöl, wenig Zitronensaft und Knoblauch; Kräuter kommen nur sehr sparsam dazu.</p></div><a class="recipe-link"'
          mild_new = '<article class="recipe-card"><div><h3>Gemüsefinish-Mild</h3><p>Ein zurückhaltendes Finish mit mildem Olivenöl, wenig Zitronensaft und Knoblauch; Kräuter kommen nur sehr sparsam dazu.</p><a class="card-thumb" href="gemuesefinish-mild.html" aria-label="Gemüsefinish-Mild öffnen"><img src="assets/gemuesefinish-mild.jpg?v=281" alt="Gemüsefinish-Mild mit gegrilltem Gemüse" width="1672" height="941" loading="lazy" decoding="async"></a></div><a class="recipe-link"'
          text = text.replace(fresh_old, fresh_new, 1)
          text = text.replace(mild_old, mild_new, 1)
          text = text.replace('Chefkoch Kim · Version 2.8.0', 'Chefkoch Kim · Version 2.8.1')
          save(path, text)

          # Startseite und maschinenlesbaren Projektstatus synchronisieren.
          path = 'index.html'
          text = load(path)
          text = text.replace('"bookVersion": "2.8.0"', '"bookVersion": "2.8.1"')
          text = text.replace('"path":"finishing-sauce.html","role":"Eigene Rezeptseite für Gemüsefinish-Fresh unter Soßen & Finishes","status":"bestätigt"', '"path":"finishing-sauce.html","role":"Eigene Rezeptseite für Gemüsefinish-Fresh unter Soßen & Finishes","status":"bestätigt mit Rezeptbild und Thumbnail"')
          text = text.replace('"path":"gemuesefinish-mild.html","role":"Eigene Rezeptseite für Gemüsefinish-Mild unter Soßen & Finishes","status":"Arbeitsfassung"', '"path":"gemuesefinish-mild.html","role":"Eigene Rezeptseite für Gemüsefinish-Mild unter Soßen & Finishes","status":"Arbeitsfassung mit Rezeptbild und Thumbnail"')
          text = text.replace('"version":"1.0.2","status":"bestätigt"', '"version":"1.0.3","status":"bestätigt"')
          text = text.replace('"version":"0.1.1","status":"Arbeitsfassung"', '"version":"0.1.2","status":"Arbeitsfassung"')
          state_start = text.index('<script id="chefkoch-kim-state"')
          hist_start = text.index('"history": [', state_start)
          hist_end = text.index('\n  ]\n}\n</script>', hist_start)
          if '"version":"2.8.1"' not in text[hist_start:hist_end]:
              entry = ',\n    {"date":"2026-08-02","version":"2.8.1","change":"Gemüsefinish-Fresh und Gemüsefinish-Mild mit Hero-Bildern sowie anklickbaren Thumbnails unter Soßen & Finishes ergänzt."}'
              text = text[:hist_end] + entry + text[hist_end:]
          text = text.replace('Chefkoch Kim · Version 2.8.0', 'Chefkoch Kim · Version 2.8.1')
          save(path, text)

          # Projektstatus synchronisieren.
          path = '00_Projektstatus.md'
          text = load(path)
          text = text.replace('**Buchversion:** 2.8.0', '**Buchversion:** 2.8.1')
          text = text.replace('- `assets/grillgemuese.jpg` – weboptimiertes JPEG-Rezeptbild für Grillgemüse', '- `assets/grillgemuese.jpg` – weboptimiertes JPEG-Rezeptbild für Grillgemüse\n- `assets/gemuesefinish-fresh.jpg` – weboptimiertes JPEG-Rezeptbild für Gemüsefinish-Fresh\n- `assets/gemuesefinish-mild.jpg` – weboptimiertes JPEG-Rezeptbild für Gemüsefinish-Mild')
          text = text.replace('- 2 Rezeptseiten mit eingebautem Hero-Bild\n- 2 Übersichtsseiten mit anklickbaren Rezept-Thumbnails', '- 4 Rezeptseiten mit eingebautem Hero-Bild\n- 2 Übersichtsseiten mit insgesamt 4 anklickbaren Rezept-Thumbnails')
          text = text.replace('Grillgemüse – Rubrik Salate & Gemüse, Arbeitsfassung, Version 0.9.2', 'Grillgemüse – Rubrik Salate & Gemüse, Arbeitsfassung, Version 0.9.3')
          text = text.replace('Gemüsefinish-Fresh – Rubrik Soßen & Finishes, bestätigt, Version 1.0.2', 'Gemüsefinish-Fresh – Rubrik Soßen & Finishes, bestätigt, Version 1.0.3')
          text = text.replace('Gemüsefinish-Mild – Rubrik Soßen & Finishes, Arbeitsfassung, Version 0.1.1', 'Gemüsefinish-Mild – Rubrik Soßen & Finishes, Arbeitsfassung, Version 0.1.2')
          text = text.replace('- Version: 1.0.2\n- Status: bestätigt', '- Version: 1.0.3\n- Status: bestätigt\n- Bild: `assets/gemuesefinish-fresh.jpg`\n- Das Bild ist als Hero-Bild auf der Rezeptseite und als anklickbares Thumbnail unter Soßen & Finishes eingebunden.')
          text = text.replace('- Version: 0.1.1\n- Status: Arbeitsfassung', '- Version: 0.1.2\n- Status: Arbeitsfassung\n- Bild: `assets/gemuesefinish-mild.jpg`\n- Das Bild ist als Hero-Bild auf der Rezeptseite und als anklickbares Thumbnail unter Soßen & Finishes eingebunden.')
          text = text.replace('- Lachs- und Grillgemüse-Bilder als Thumbnails auf den jeweiligen Übersichtsseiten ergänzt', '- Lachs-, Grillgemüse- und Finish-Bilder als Thumbnails auf den jeweiligen Übersichtsseiten ergänzt')
          text = text.replace('- Rezeptversion Grillgemüse auf 0.9.3 erhöht\n- Buchversion auf 2.8.0 erhöht', '- Rezeptversion Grillgemüse auf 0.9.3 erhöht\n- Rezeptversion Gemüsefinish-Fresh auf 1.0.3 erhöht\n- Rezeptversion Gemüsefinish-Mild auf 0.1.2 erhöht\n- Buchversion auf 2.8.1 erhöht')
          history_marker = '## Änderungshistorie\n'
          if '### Version 2.8.1' not in text:
              entry = '\n### Version 2.8.1 – 02.08.2026\n\n- Gemüsefinish-Fresh mit dem Hero-Bild `assets/gemuesefinish-fresh.jpg` ergänzt\n- Gemüsefinish-Mild mit dem Hero-Bild `assets/gemuesefinish-mild.jpg` ergänzt\n- beide Bilder als anklickbare, lazy-geladene Thumbnails unter Soßen & Finishes eingebaut\n- stabile ASCII-Dateinamen für die beiden hochgeladenen Bilder angelegt\n- Rezeptversion Gemüsefinish-Fresh auf 1.0.3 erhöht\n- Rezeptversion Gemüsefinish-Mild auf 0.1.2 erhöht\n- Buchversion auf 2.8.1 erhöht\n'
              text = text.replace(history_marker, history_marker + entry, 1)
          save(path, text)
          PY

          rm .github/workflows/apply-finish-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finishing-sauce.html gemuesefinish-mild.html gemuese-salat.html index.html 00_Projektstatus.md .github/workflows/apply-finish-images.yml
          git commit -m "Finish-Bilder und Thumbnails verknüpfen"
          git push