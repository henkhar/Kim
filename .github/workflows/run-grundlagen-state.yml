name: Run Grundlagen state sync

on:
  push:
    paths:
      - trigger-grundlagen-state.txt

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projektstatus synchronisieren
        run: python scripts/update_grundlagen_state.py
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 00_Projektstatus.md
          git commit -m "Projektstatus für Salzlake und Dry Brine synchronisieren"
          git push
