name: Apply shopping lists to all recipes

on:
  push:
    paths:
      - .github/workflows/apply-shopping-list-all-recipes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend shopping lists to every recipe
        run: python .github/scripts/apply_shopping_lists.py
      - name: Commit changes
        run: |
          git config user.name "Chefkoch Kim"
          git config user.email "actions@users.noreply.github.com"
          git add index.html 00_Meta-Kim.md 00_Projektstatus.md grillgemuese.html finishing-sauce.html gemuesefinish-mild.html einkaufsliste.html
          git commit -m "Einkaufslisten auf alle Einzelrezepte erweitern"
          git push
