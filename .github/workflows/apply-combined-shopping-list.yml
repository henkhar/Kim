name: Apply combined shopping list

on:
  push:
    paths:
      - .github/workflows/apply-combined-shopping-list.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build combined shopping list
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def update_json_script(text, script_id, updater):
              pattern = rf'(<script id="{re.escape(script_id)}" type="application/json">\n)(.*?)(\n</script>)'
              match = re.search(pattern, text, flags=re.S)
              if not match:
                  raise RuntimeError(f'JSON-Script {script_id} nicht gefunden')
              data = json.loads(match.group(2))
              updater(data)
              replacement = match.group(1) + json.dumps(data, ensure_ascii=False, indent=2) + match.group(3)
              return text[:match.start()] + replacement + text[match.end():]

          page = r'''<!doctype html>
          <html lang="de">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
