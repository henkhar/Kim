          <style>
          :root{--bg:#f5f5f7;--surface:#fff;--ink:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--accent:#bc4b2d;--soft:#eef3ea;--warn:#fff3dc}
          *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}.page{min-height:100vh;display:flex;flex-direction:column}.topbar{position:sticky;top:0;z-index:10;min-height:64px;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:0 clamp(16px,4vw,48px);background:#ffffffe8;backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid #0000000d}.menu-button{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:50%;cursor:pointer}.menu-button:hover,.menu-button:focus-visible{background:#00000008;outline:none}.menu-icon,.menu-icon::before,.menu-icon::after{width:24px;height:2px;border-radius:999px;background:var(--ink);content:"";display:block}.menu-icon{position:relative}.menu-icon::before{position:absolute;top:-7px}.menu-icon::after{position:absolute;top:7px}.home-button{position:absolute;top:10px;left:calc(clamp(16px,4vw,48px) + 52px);width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:#f2f2f4;color:var(--ink);text-decoration:none}.home-button:hover,.home-button:focus-visible{background:#e8e8ed;outline:none}.home-button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.brand{text-align:center;font-size:1rem;font-weight:600;letter-spacing:-.01em}.wrap{width:min(1080px,calc(100% - 32px));margin:auto}.hero{padding:clamp(72px,10vw,118px) 0 34px}.eyebrow{margin:0 0 14px;color:var(--accent);font-size:.78rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(3.7rem,9vw,7.6rem);line-height:.92;letter-spacing:-.075em}.hero p{max-width:800px;margin:22px 0 0;color:var(--muted);font-size:1.08rem;line-height:1.55}.panel{margin-bottom:22px;padding:clamp(24px,5vw,44px);border-radius:28px;background:var(--surface)}.planner-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.42fr);gap:26px;align-items:end;margin-bottom:28px}.planner-head h2,.result-head h2{margin:0 0 10px;font-size:clamp(2rem,5vw,3.4rem);line-height:1;letter-spacing:-.05em}.planner-head p,.result-head p{margin:0;color:var(--muted);line-height:1.5}.global-options{display:grid;gap:14px}.field{display:grid;gap:7px;font-weight:650}.field span{font-size:.86rem}.field input,.field select{width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit;font-size:1rem}.field input:focus,.field select:focus{outline:3px solid #bc4b2d22;border-color:var(--accent)}.option{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.94rem;line-height:1.4}.option input{width:20px;height:20px;accent-color:var(--accent)}.recipe-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.recipe-choice{padding:20px;border:1px solid #ececef;border-radius:20px;background:#fafafa}.recipe-choice:has(.recipe-checkbox:checked){border-color:#1d1d1f44;background:#f4f4f6}.choice-main{display:flex;align-items:flex-start;gap:14px;cursor:pointer}.choice-main input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}.choice-copy{display:grid;gap:5px}.choice-copy b{font-size:1.06rem}.choice-copy span{color:var(--muted);font-size:.92rem;line-height:1.42}.choice-extra{margin:16px 0 0 36px}.choice-extra .field span{font-size:.8rem}.planner-note{margin:18px 0 0;padding:16px 18px;border-radius:16px;background:var(--warn);color:#6d5325;line-height:1.5}.planner-actions,.result-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.button{min-height:48px;padding:0 18px;border:0;border-radius:14px;background:var(--ink);color:#fff;font:inherit;font-weight:700;cursor:pointer}.button:hover,.button:focus-visible{opacity:.86;outline:none}.button.secondary{background:#ececf0;color:var(--ink)}.button.accent{background:var(--accent)}.result-panel[hidden]{display:none}.result-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:26px}.result-meta{color:var(--muted);font-size:.94rem;text-align:right}.selection-summary{margin:0 0 24px;padding:16px 18px;border-radius:16px;background:var(--soft);line-height:1.5}.shopping-group{margin-top:28px}.shopping-group:first-child{margin-top:0}.shopping-group h3{margin:0 0 12px;color:var(--muted);font-size:.8rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.shopping-list{display:grid;gap:10px}.shopping-item{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:14px;min-height:66px;padding:12px 16px;border:1px solid #ececef;border-radius:16px;background:#fafafa;cursor:pointer}.shopping-item:hover{background:#f5f5f7}.shopping-item input{width:21px;height:21px;accent-color:var(--accent)}.item-copy{display:grid;gap:3px}.item-name{font-weight:650}.item-sources{color:var(--muted);font-size:.78rem;line-height:1.35}.item-amount{color:var(--muted);text-align:right;white-space:nowrap}.shopping-item:has(input:checked){opacity:.52}.shopping-item:has(input:checked) .item-name,.shopping-item:has(input:checked) .item-amount{text-decoration:line-through}.empty{padding:20px;border-radius:16px;background:var(--warn);color:#6d5325;line-height:1.5}.home-link{display:inline-flex;align-items:center;gap:8px;margin:4px 0 54px;color:var(--accent);text-decoration:none;font-weight:650}.home-link:hover,.home-link:focus-visible{text-decoration:underline}footer{padding:20px 0 44px;text-align:center;color:var(--muted);font-size:.85rem}.drawer{position:fixed;inset:0 auto 0 0;width:min(340px,86vw);padding:30px;background:var(--surface);box-shadow:18px 0 50px #0002;transform:translateX(-110%);transition:transform .25s ease;z-index:20}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.drawer h2{margin:0;font-size:1.6rem;letter-spacing:-.03em}.close-button{width:40px;height:40px;border:0;border-radius:50%;background:#f2f2f4;font-size:1.4rem;cursor:pointer}.drawer nav{display:grid}.drawer a{padding:14px 0;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}.drawer a:hover,.drawer a:focus-visible{color:var(--accent)}.backdrop{position:fixed;inset:0;background:#0005;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:15}.backdrop.show{opacity:1;pointer-events:auto}@media(max-width:760px){.planner-head,.recipe-choices{grid-template-columns:1fr}.result-head{display:block}.result-meta{margin-top:10px;text-align:left}.shopping-item{grid-template-columns:24px minmax(0,1fr)}.item-amount{grid-column:2;text-align:left;white-space:normal}.choice-extra{margin-left:36px}}@media(max-width:430px){.topbar{grid-template-columns:52px 1fr 52px;padding:0 8px}.home-button{left:60px}.brand{font-size:.9rem}.panel{padding:22px;border-radius:22px}.hero h1{font-size:clamp(3.5rem,15vw,5.7rem)}.planner-actions,.result-actions{display:grid}.button{width:100%}}
          @media print{body{background:#fff}.topbar,.drawer,.backdrop,.hero,.planner-panel,.result-actions,.home-link,footer{display:none!important}.wrap{width:100%;max-width:none}.result-panel{display:block!important;padding:0}.shopping-item{break-inside:avoid;background:#fff}.shopping-item:has(input:checked){display:none}.shopping-item input{appearance:none;width:16px;height:16px;border:1.5px solid #333;border-radius:3px}.item-name,.item-amount{text-decoration:none!important}.result-meta{color:#333}}
          </style>
          </head>
          <body>
          <div class="page">
          <header class="topbar"><button class="menu-button" type="button" aria-label="Menü öffnen" aria-expanded="false"><span class="menu-icon"></span></button><a class="home-button" href="index.html" aria-label="Zur Startseite" title="Startseite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.8l8.5 6.7"/><path d="M5.5 9.2V20h13V9.2"/><path d="M9.5 20v-6h5v6"/></svg></a><div class="brand">Haralds Grillkochbuch</div><div></div></header>
          <main class="wrap">
          <section class="hero"><p class="eyebrow">Planung für mehrere Rezepte</p><h1>Gemeinsame<br>Einkaufsliste</h1><p>Rezepte auswählen, eine gemeinsame Personenzahl festlegen und gleiche Zutaten automatisch zusammenrechnen lassen.</p></section>
          <section class="panel planner-panel" aria-labelledby="planner-title">
          <div class="planner-head"><div><h2 id="planner-title">Was möchtest du grillen?</h2><p>Die Personenzahl gilt für jedes ausgewählte Rezept. Optionale Zutaten können gemeinsam ein- oder ausgeschaltet werden.</p></div><div class="global-options"><label class="field" for="servings"><span>Für wie viele Personen?</span><input id="servings" type="number" min="1" max="20" step="1" value="4" inputmode="numeric"></label><label class="option"><input id="include-optional" type="checkbox" checked>Optionale Zutaten aufnehmen</label></div></div>
          <div class="recipe-choices">
          <article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="honig-senf-lachs-grill"><span class="choice-copy"><b>Honig-Senf-Lachs vom Grill</b><span>Lachsfilets und Honig-Senf-Glasur.</span></span></label></article>
          <article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="grillgemuese-gasgrill"><span class="choice-copy"><b>Grillgemüse</b><span>Gemüse, Rapsöl sowie Salz und Pfeffer.</span></span></label></article>
          <article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="finishing-sauce-grillgemuese-haehnchen"><span class="choice-copy"><b>Gemüsefinish-Fresh</b><span>Zitrone, Kräuter, Knoblauch, Honig und mildes Olivenöl.</span></span></label></article>
          <article class="recipe-choice"><label class="choice-main"><input class="recipe-checkbox" type="checkbox" value="gemuesefinish-mild"><span class="choice-copy"><b>Gemüsefinish-Mild</b><span>Mildes Finish mit wählbarer Knoblauchvariante.</span></span></label><div class="choice-extra"><label class="field" for="mild-garlic"><span>Knoblauch für Gemüsefinish-Mild</span><select id="mild-garlic"><option value="powder">Knoblauchpulver</option><option value="fresh">Frische Knoblauchzehen</option></select></label></div></article>
          </div>
          <p class="planner-note"><b>Wichtig:</b> Das im Grillgemüse-Rezept verlinkte Gemüsefinish-Fresh wird nicht automatisch zusätzlich eingerechnet. Hake das gewünschte Finish separat an – so wird nichts doppelt gezählt.</p>
          <div class="planner-actions"><button class="button secondary" id="select-all" type="button">Alle auswählen</button><button class="button secondary" id="clear-selection" type="button">Auswahl löschen</button><button class="button accent" id="build-list" type="button">Gemeinsame Einkaufsliste erstellen</button></div>
          </section>
          <section class="panel result-panel" id="result-panel" aria-live="polite" hidden><div class="result-head"><div><h2>Benötigte Zutaten</h2><p>Gleiche Zutaten und kompatible Einheiten wurden zusammengeführt.</p></div><div class="result-meta" id="result-meta"></div></div><p class="selection-summary" id="selection-summary"></p><div id="result-content"></div><div class="result-actions"><button class="button" id="print-list" type="button">Liste drucken</button><button class="button secondary" id="reset-checks" type="button">Häkchen zurücksetzen</button></div></section>
          <a class="home-link" href="index.html">← Zur Startseite</a>
          </main>
          <footer>Chefkoch Kim · Gemeinsame Einkaufsliste · Version 2.11.0</footer>
          </div>
          <aside class="drawer" aria-hidden="true"><div class="drawer-head"><h2>Menü</h2><button class="close-button" type="button" aria-label="Menü schließen">×</button></div><nav><a href="index.html">Startseite</a><a href="einkaufsliste-gesamt.html">Einkaufsliste</a><a href="fleisch.html">Fleisch</a><a href="gemuese-salat.html">Salate &amp; Beilagen</a><a href="vegan.html">Vegan</a><a href="grundlagen.html">Grundlagen</a><a href="kochbuch.html">Gesamtes Kochbuch</a></nav></aside><div class="backdrop"></div>
          <noscript><p class="empty">Für die Mengenberechnung muss JavaScript im Browser aktiviert sein.</p></noscript>
          <script>
          const categoryOrder=['fisch','gemuese','vorrat'];
          const categoryLabels={fisch:'Fisch',gemuese:'Gemüse & Kräuter',vorrat:'Öle, Gewürze & Vorrat'};
          const recipes={
            'honig-senf-lachs-grill':{title:'Honig-Senf-Lachs vom Grill',ingredients:[
              {key:'lachsfilets',label:'Lachsfilets mit Haut',category:'fisch',unit:'count',amount:4,unitLabel:'Stück',whole:true},
              {key:'senf-grob',label:'Grober Senf',category:'vorrat',unit:'ml',amount:15},
              {key:'senf-mittelscharf',label:'Mittelscharfer Senf',category:'vorrat',unit:'ml',amount:15},
              {key:'honig',label:'Honig',category:'vorrat',unit:'ml',amount:15},
              {key:'olivenoel-mild',label:'Mildes Olivenöl',category:'vorrat',unit:'ml',amount:15},
              {key:'zitronensaft',label:'Frischer Zitronensaft',category:'gemuese',unit:'ml',amount:5},
              {key:'salz',label:'Salz',category:'vorrat',unit:'ml',note:'zusätzlich nach Bedarf'},
              {key:'pfeffer-schwarz',label:'Schwarzer Pfeffer',category:'vorrat',unit:'note',note:'nach Geschmack'},
              {key:'dill',label:'Dill',category:'gemuese',unit:'note',note:'sehr empfehlenswert',optional:true}
            ]},
            'grillgemuese-gasgrill':{title:'Grillgemüse',ingredients:[
              {key:'zucchini',label:'Zucchini',category:'gemuese',unit:'count',amount:2,unitLabel:'Stück',whole:true},
              {key:'paprika-rot',label:'Rote Paprika',category:'gemuese',unit:'count',amount:2,unitLabel:'Stück',whole:true},
              {key:'paprika-gelb',label:'Gelbe Paprika',category:'gemuese',unit:'count',amount:1,unitLabel:'Stück',whole:true},
              {key:'aubergine',label:'Aubergine',category:'gemuese',unit:'count',amount:1,unitLabel:'Stück',whole:true},
              {key:'champignons',label:'Champignons',category:'gemuese',unit:'g',amount:400},
              {key:'zwiebeln-rot',label:'Rote Zwiebeln',category:'gemuese',unit:'count',amount:2,unitLabel:'Stück',whole:true},
              {key:'fruehlingszwiebeln',label:'Frühlingszwiebeln',category:'gemuese',unit:'count',amount:1,unitLabel:'Bund',whole:true},
              {key:'rapsoel',label:'Rapsöl',category:'vorrat',unit:'ml',amount:45},
              {key:'salz',label:'Salz',category:'vorrat',unit:'ml',note:'zusätzlich nach Bedarf'},
              {key:'pfeffer-schwarz',label:'Schwarzer Pfeffer',category:'vorrat',unit:'note',note:'nach Geschmack'}
            ]},
            'finishing-sauce-grillgemuese-haehnchen':{title:'Gemüsefinish-Fresh',ingredients:[
              {key:'olivenoel-mild',label:'Mildes Olivenöl',category:'vorrat',unit:'ml',amount:30},
              {key:'zitronensaft',label:'Frischer Zitronensaft',category:'gemuese',unit:'ml',amount:15},
              {key:'honig',label:'Honig',category:'vorrat',unit:'ml',amount:5},
              {key:'knoblauch-frisch',label:'Knoblauch',category:'gemuese',unit:'count',amount:2,unitLabel:'kleine Zehen',whole:true},
              {key:'petersilie',label:'Petersilie, fein gehackt',category:'gemuese',unit:'ml-range',amountMin:15,amountMax:30},
              {key:'salz',label:'Salz',category:'vorrat',unit:'ml',amount:2.5},
              {key:'pfeffer-schwarz',label:'Schwarzer Pfeffer',category:'vorrat',unit:'note',note:'frisch gemahlen'},
              {key:'zitronenschale',label:'Fein abgeriebene Zitronenschale',category:'gemuese',unit:'ml',amount:1.25,optional:true},
              {key:'thymian-rosmarin',label:'Thymian oder Rosmarin, fein gehackt',category:'gemuese',unit:'ml',amount:1.25,optional:true}
            ]},
            'gemuesefinish-mild':{title:'Gemüsefinish-Mild',ingredients:[
              {key:'olivenoel-mild',label:'Mildes Olivenöl',category:'vorrat',unit:'ml',amount:30},
              {key:'salz',label:'Salz',category:'vorrat',unit:'ml',amount:5},
              {key:'pfeffer-schwarz',label:'Schwarzer Pfeffer',category:'vorrat',unit:'note',note:'nach Geschmack'},
              {key:'zitronensaft',label:'Frischer Zitronensaft',category:'gemuese',unit:'ml',amount:5},
              {key:'thymian-rosmarin',label:'Thymian oder Rosmarin',category:'gemuese',unit:'note',note:'für Gemüsefinish-Mild: wenig und sparsam',optional:true}
            ],variants:{powder:{key:'knoblauchpulver',label:'Knoblauchpulver',category:'vorrat',unit:'ml',amount:5},fresh:{key:'knoblauch-frisch',label:'Knoblauch',category:'gemuese',unit:'count',amount:2,unitLabel:'kleine Zehen',whole:true}}}
          };
          const numberFormat=new Intl.NumberFormat('de-DE',{maximumFractionDigits:2});
          const servingsInput=document.getElementById('servings');
          const optionalInput=document.getElementById('include-optional');
          const garlicSelect=document.getElementById('mild-garlic');
          const recipeBoxes=[...document.querySelectorAll('.recipe-checkbox')];
          const resultPanel=document.getElementById('result-panel');
          const resultContent=document.getElementById('result-content');
          const resultMeta=document.getElementById('result-meta');
          const selectionSummary=document.getElementById('selection-summary');
          const planKey='chefkoch-kim:gemeinsame-einkaufsliste:plan';
          let currentSignature='';

          function clampServings(value){const parsed=Number.parseInt(value,10);return Number.isFinite(parsed)?Math.min(20,Math.max(1,parsed)):4}
          function selectedIds(){return recipeBoxes.filter(box=>box.checked).map(box=>box.value)}
          function savePlan(){localStorage.setItem(planKey,JSON.stringify({servings:clampServings(servingsInput.value),optional:optionalInput.checked,garlic:garlicSelect.value,recipes:selectedIds()}))}
          function restorePlan(){try{const saved=JSON.parse(localStorage.getItem(planKey)||'null');if(!saved)return;servingsInput.value=String(clampServings(saved.servings));optionalInput.checked=saved.optional!==false;garlicSelect.value=saved.garlic==='fresh'?'fresh':'powder';const ids=new Set(Array.isArray(saved.recipes)?saved.recipes:[]);recipeBoxes.forEach(box=>box.checked=ids.has(box.value))}catch{}}
          function addIngredient(map,item,recipeTitle,factor){if(item.optional&&!optionalInput.checked)return;let entry=map.get(item.key);if(!entry){entry={key:item.key,label:item.label,category:item.category,unit:item.unit,unitLabel:item.unitLabel||'',whole:Boolean(item.whole),amount:0,amountMin:0,amountMax:0,notes:new Set(),sources:new Set()};map.set(item.key,entry)}entry.sources.add(recipeTitle);if(item.note)entry.notes.add(item.note);if(typeof item.amount==='number')entry.amount+=item.amount*factor;if(typeof item.amountMin==='number')entry.amountMin+=item.amountMin*factor;if(typeof item.amountMax==='number')entry.amountMax+=item.amountMax*factor}
          function aggregate(ids,servings){const factor=servings/4;const map=new Map();for(const id of ids){const recipe=recipes[id];for(const item of recipe.ingredients)addIngredient(map,item,recipe.title,factor);if(id==='gemuesefinish-mild')addIngredient(map,recipe.variants[garlicSelect.value],recipe.title,factor)}return [...map.values()]}
          function formatVolume(ml){const rounded=Math.round(ml*100)/100;if(rounded>=15){const tablespoons=Math.floor((rounded+1e-9)/15);const remainder=Math.round((rounded-tablespoons*15)*100)/100;if(Math.abs(remainder)<.01)return `${numberFormat.format(tablespoons)} EL`;const teaspoons=remainder/5;if(Math.abs(teaspoons-Math.round(teaspoons))<.01||Math.abs(teaspoons*2-Math.round(teaspoons*2))<.01)return `${numberFormat.format(tablespoons)} EL + ${numberFormat.format(teaspoons)} TL`;return `${numberFormat.format(rounded/15)} EL`}return `${numberFormat.format(rounded/5)} TL`}
          function formatAmount(entry){let amount='';if(entry.unit==='ml')amount=entry.amount>0?formatVolume(entry.amount):'';else if(entry.unit==='ml-range')amount=`${formatVolume(entry.amountMin)}–${formatVolume(entry.amountMax)}`;else if(entry.unit==='g'){const grams=Math.round(entry.amount);amount=grams>=1000?`${numberFormat.format(grams/1000)} kg`:`${numberFormat.format(grams)} g`}else if(entry.unit==='count'){const count=entry.whole?Math.ceil(entry.amount):Math.round(entry.amount*100)/100;amount=`${numberFormat.format(count)} ${entry.unitLabel}`}const notes=[...entry.notes];if(amount&&notes.length)return `${amount} · ${notes.join('; ')}`;return amount||notes.join('; ')||'nach Bedarf'}
          function stateKey(){return `chefkoch-kim:gemeinsame-einkaufsliste:${currentSignature}`}
          function readChecks(){try{return JSON.parse(localStorage.getItem(stateKey())||'{}')}catch{return {}}}
          function saveChecks(state){localStorage.setItem(stateKey(),JSON.stringify(state))}
          function itemHtml(entry,state){const checked=state[entry.key]?' checked':'';const sources=[...entry.sources].join(' · ');return `<label class="shopping-item"><input type="checkbox" data-key="${entry.key}"${checked}><span class="item-copy"><span class="item-name">${entry.label}</span><span class="item-sources">aus: ${sources}</span></span><span class="item-amount">${formatAmount(entry)}</span></label>`}
