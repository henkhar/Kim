name: Run combined shopping list

on:
  push:
    paths:
      - .github/workflows/run-combined-shopping-list.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and run implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/apply-combined-shopping-list.yml').read_text(encoding='utf-8')
          marker = "python - <<'PY'\n"
          if marker not in source:
              raise SystemExit('Implementierungsblock nicht gefunden')
          block = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          script = textwrap.dedent(block)
          Path('/tmp/apply_combined.py').write_text(script, encoding='utf-8')
          exec(compile(script, '/tmp/apply_combined.py', 'exec'))
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('einkaufsliste-gesamt.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit('Seitenskript nicht eindeutig gefunden')
          Path('/tmp/einkaufsliste-gesamt.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/einkaufsliste-gesamt.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 00_Meta-Kim.md 00_Projektstatus.md einkaufsliste-gesamt.html *.html
          git commit -m "Gemeinsame Einkaufsliste mit Zutatenkumulierung ergänzen"
          git push
          # Trigger 2